<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenario Forge 社区与后台</title>
  <link rel="stylesheet" href="/backend/styles.css">
</head>
<body>
  <main class="console-shell">
    <header class="hero">
      <div>
        <p class="eyebrow" data-i18n="productKicker">地图社区平台</p>
        <h1 data-i18n="productTitle">Scenario Forge 社区与后台</h1>
        <p class="hero-copy" data-i18n="productCopy">玩家看到社区、存档和评论；管理员看到审核队列、用户状态、权限和社区动态。</p>
      </div>
      <div class="hero-actions">
        <button class="plain" id="languageToggle">English</button>
        <a class="plain" href="/app/" data-i18n="openEditor">打开编辑器</a>
      </div>
    </header>

    <nav class="mode-nav" role="tablist" aria-label="平台视角">
      <button class="active" id="communityTab" role="tab" aria-selected="true" aria-controls="communityView" data-view="community" data-i18n="communityView">公开社区</button>
      <button id="accountTab" role="tab" aria-selected="false" aria-controls="accountView" data-view="account" data-i18n="accountView">用户中心</button>
      <button id="adminTab" role="tab" aria-selected="false" aria-controls="adminView" data-view="admin" data-i18n="adminView">管理员后台</button>
    </nav>

    <section class="session-strip" id="sessionStrip">
      <span class="status-dot" id="sessionDot"></span>
      <span id="sessionLabel">未登录</span>
      <button id="openLoginBtn" class="primary" data-i18n="login">登录</button>
      <button id="openRegisterBtn" data-i18n="register">注册</button>
      <button id="logoutBtn" data-i18n="logout">登出</button>
    </section>

    <section class="view active" id="communityView" role="tabpanel" aria-labelledby="communityTab" data-view-panel="community">
      <div class="section-head">
        <div>
          <p class="eyebrow" data-i18n="communityKicker">玩家视角</p>
          <h2 data-i18n="communityTitle">社区帖子流</h2>
        </div>
        <div class="toolbar">
          <button id="refreshCommunityBtn" data-i18n="refreshCommunity">刷新社区</button>
        </div>
      </div>
      <div id="communityFeed" class="post-grid" aria-live="polite"></div>
    </section>

    <section class="view" id="accountView" role="tabpanel" aria-labelledby="accountTab" data-view-panel="account">
      <div class="gate" id="accountGate">
        <h2 data-i18n="accountGateTitle">登录后查看用户中心</h2>
        <p data-i18n="accountGateCopy">用户中心只展示当前用户自己的存档、发布状态和导出操作。</p>
      </div>
      <div class="account-layout" id="accountContent" hidden>
        <section class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow" data-i18n="accountKicker">用户视角</p>
              <h2 data-i18n="myLibrary">我的存档库</h2>
            </div>
            <button id="createSampleBtn" class="primary" data-i18n="createSample">创建示例存档</button>
          </div>
          <div id="mySavesList" class="stack-list" aria-live="polite"></div>
        </section>
        <form id="manualSaveForm" class="panel editor-panel">
          <h3 data-i18n="newPost">发布前草稿</h3>
          <label>
            <span data-i18n="title">标题</span>
            <input id="saveTitleInput" value="新的地图存档">
          </label>
          <label>
            <span data-i18n="description">描述</span>
            <textarea id="saveDescriptionInput">这里描述地图玩法、规则和适用场景。</textarea>
          </label>
          <label>
            <span data-i18n="imageUrl">封面图片 URL</span>
            <input id="saveImageInput" value="/backend/assets/demo-plains.svg">
          </label>
          <button class="wide primary" type="submit" data-i18n="saveDraft">保存为私有草稿</button>
        </form>
      </div>
    </section>

    <section class="view" id="adminView" role="tabpanel" aria-labelledby="adminTab" data-view-panel="admin">
      <div class="gate" id="adminGate">
        <h2 data-i18n="adminGateTitle">管理员权限后进入后台</h2>
        <p data-i18n="adminGateCopy">后台入口只给 admin 或 moderator 显示，所有管理动作都经过后端权限校验。</p>
      </div>
      <div class="admin-layout" id="adminContent" hidden>
        <aside class="admin-rail">
          <div class="metric-grid" id="metricGrid">
            <div><span data-i18n="metricUsers">用户</span><strong>-</strong></div>
            <div><span data-i18n="metricSaves">帖子</span><strong>-</strong></div>
            <div><span data-i18n="metricPublic">公开</span><strong>-</strong></div>
            <div><span data-i18n="metricReports">待审举报</span><strong>-</strong></div>
            <div><span data-i18n="metricComments">评论</span><strong>-</strong></div>
            <div><span data-i18n="metricBanned">封禁</span><strong>-</strong></div>
          </div>
          <button id="refreshAdminBtn" class="wide" data-i18n="refreshAdmin">刷新后台</button>
          <button id="seedDemoBtn" class="wide primary" data-admin-only data-i18n="seedDemo">生成样例帖子</button>
        </aside>
        <section class="admin-main">
          <div class="admin-tabs" role="tablist" aria-label="管理员栏目">
            <button class="active" id="adminActivityTab" role="tab" aria-selected="true" aria-controls="adminActivityPanel" data-admin-tab="activity" data-i18n="activityTab">动态</button>
            <button id="adminContentTab" role="tab" aria-selected="false" aria-controls="adminContentPanel" data-admin-tab="content" data-i18n="contentTab">内容</button>
            <button id="adminCommentsTab" role="tab" aria-selected="false" aria-controls="adminCommentsPanel" data-admin-tab="comments" data-i18n="commentsTab">评论</button>
            <button id="adminUsersTab" role="tab" aria-selected="false" aria-controls="adminUsersPanel" data-admin-tab="users" data-admin-only data-i18n="usersTab">用户</button>
            <button id="adminReportsTab" role="tab" aria-selected="false" aria-controls="adminReportsPanel" data-admin-tab="reports" data-i18n="reportsTab">举报</button>
          </div>
          <div class="admin-panel active" id="adminActivityPanel" role="tabpanel" aria-labelledby="adminActivityTab" data-admin-panel="activity">
            <h3 data-i18n="activityTitle">社区动态</h3>
            <div id="activityList" class="stack-list" aria-live="polite"></div>
          </div>
          <div class="admin-panel" id="adminContentPanel" role="tabpanel" aria-labelledby="adminContentTab" data-admin-panel="content">
            <h3 data-i18n="contentTitle">内容与图片管理</h3>
            <div id="adminSavesList" class="stack-list" aria-live="polite"></div>
          </div>
          <div class="admin-panel" id="adminCommentsPanel" role="tabpanel" aria-labelledby="adminCommentsTab" data-admin-panel="comments">
            <h3 data-i18n="commentsTitle">评论管理</h3>
            <div id="commentsList" class="stack-list" aria-live="polite"></div>
          </div>
          <div class="admin-panel" id="adminUsersPanel" role="tabpanel" aria-labelledby="adminUsersTab" data-admin-panel="users" data-admin-only>
            <h3 data-i18n="usersTitle">用户与权限</h3>
            <div id="usersList" class="stack-list" aria-live="polite"></div>
          </div>
          <div class="admin-panel" id="adminReportsPanel" role="tabpanel" aria-labelledby="adminReportsTab" data-admin-panel="reports">
            <h3 data-i18n="reportsTitle">举报审核</h3>
            <div id="reportsList" class="stack-list" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <dialog id="authDialog" aria-labelledby="authTitle">
    <form method="dialog" class="auth-card">
      <button class="dialog-close" id="authCloseBtn" value="cancel" aria-label="关闭">×</button>
      <h2 id="authTitle">登录</h2>
      <label>
        <span data-i18n="username">用户名</span>
        <input id="usernameInput" autocomplete="username" value="admin">
      </label>
      <label>
        <span data-i18n="password">密码</span>
        <input id="passwordInput" type="password" autocomplete="current-password" value="correct horse">
      </label>
      <label id="displayNameField">
        <span data-i18n="displayName">显示名称</span>
        <input id="displayNameInput" autocomplete="name" value="地图管理员">
      </label>
      <button id="authSubmitBtn" class="wide primary" value="default">登录</button>
    </form>
  </dialog>

  <dialog id="detailDialog" aria-labelledby="detailTitle" aria-describedby="detailMeta">
    <article class="detail-card">
      <button class="dialog-close" id="closeDetailBtn" aria-label="关闭">×</button>
      <div id="detailImage" class="detail-image"></div>
      <h2 id="detailTitle">内容详情</h2>
      <p id="detailMeta"></p>
      <pre id="detailPayload">{}</pre>
      <button id="downloadDetailBtn" class="primary" data-i18n="downloadJson">下载 JSON</button>
    </article>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/backend/app.js"></script>
</body>
</html>
