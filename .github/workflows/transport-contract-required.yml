name: Transport Contract Required

on:
  workflow_dispatch:
  pull_request:
  # Runs on every PR for the same reason as the scenario matrix: no hand-kept path list.

permissions:
  contents: read

concurrency:
  group: transport-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  transport-contract-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-transport.lock.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-transport.lock.txt

      - name: Run transport manifest validator
        run: python tools/check_transport_workbench_manifests.py --root data/transport_layers --report-path .runtime/reports/generated/transport_workbench_manifest_report.json

      - name: Run transport manifest unit tests
        run: python -m unittest tests.test_transport_manifest_contracts tests.test_transport_workbench_manifest_runtime_contract -q
