name: Transport Contract Required

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # PR checks cover the merge candidate; manual runs retain a full audit entry.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: transport-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Transport Contract Plan
    runs-on: ubuntu-latest
    outputs:
      run_transport: ${{ steps.plan.outputs.run_transport }}
    steps:
      - name: Checkout planner only
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            tools/ci/pr_plan.mjs
            tools/ci/perf_policy.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          filter: blob:none

      - name: Resolve transport relevance
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_transport=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .runtime/tmp .runtime/reports/generated
          git -c core.quotePath=false diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- > .runtime/tmp/pr-changed-files.txt
          test -s .runtime/tmp/pr-changed-files.txt || { echo "::error::Transport planner received an empty changed-file set"; exit 1; }
          node tools/ci/pr_plan.mjs \
            --changed-files .runtime/tmp/pr-changed-files.txt \
            --labels "$PR_LABELS" \
            --json-out .runtime/reports/generated/transport-pr-plan.json \
            --github-output "$GITHUB_OUTPUT"

  transport-contract-required:
    needs: [plan]
    runs-on: ubuntu-latest
    steps:
      - name: Fast success for transport-unrelated changes
        if: needs.plan.outputs.run_transport != 'true'
        run: echo "Transport contract skipped before repository checkout."

      - name: Checkout
        if: needs.plan.outputs.run_transport == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        if: needs.plan.outputs.run_transport == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python test dependencies
        if: needs.plan.outputs.run_transport == 'true'
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Run transport manifest validator
        if: needs.plan.outputs.run_transport == 'true'
        run: python tools/check_transport_workbench_manifests.py --root data/transport_layers --report-path .runtime/reports/generated/transport_workbench_manifest_report.json

      - name: Run transport manifest unit tests
        if: needs.plan.outputs.run_transport == 'true'
        run: python -m unittest tests.test_transport_manifest_contracts tests.test_transport_workbench_manifest_runtime_contract -q
