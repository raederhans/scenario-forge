name: Transport Contract Required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: transport-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Transport Contract Plan
    runs-on: ubuntu-latest
    outputs:
      run_transport: ${{ steps.plan.outputs.run_transport }}
    steps:
      - name: Checkout planner only
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            tools/ci/pr_plan.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Resolve transport relevance
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_transport=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .runtime/tmp .runtime/reports/generated
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > .runtime/tmp/pr-changed-files.txt
          node tools/ci/pr_plan.mjs \
            --changed-files .runtime/tmp/pr-changed-files.txt \
            --labels "$PR_LABELS" \
            --json-out .runtime/reports/generated/transport-pr-plan.json \
            --github-output "$GITHUB_OUTPUT"

  transport-contract-required:
    needs: [plan]
    if: needs.plan.outputs.run_transport == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Run transport manifest validator
        run: python tools/check_transport_workbench_manifests.py --root data/transport_layers --report-path .runtime/reports/generated/transport_workbench_manifest_report.json

      - name: Run transport manifest unit tests
        run: python -m unittest tests.test_transport_manifest_contracts tests.test_transport_workbench_manifest_runtime_contract -q

  transport-contract-gate:
    name: Transport Contract Gate
    if: always()
    needs: [plan, transport-contract-required]
    runs-on: ubuntu-latest
    steps:
      - name: Require planned transport result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const plan = needs.plan;
          const lane = needs["transport-contract-required"];
          if (plan?.result !== "success") process.exit(1);
          if (!["success", "skipped"].includes(lane?.result)) process.exit(1);
          NODE
