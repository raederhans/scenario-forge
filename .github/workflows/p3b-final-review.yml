name: P3B final review
on:
  push:
    branches: [codex/paint-contours-p3b-20260925]
    paths: [.github/workflows/p3b-final-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/paint-contours-p3b-20260925
          sparse-checkout: |
            .github
            js
            tests
      - name: Apply only verified metadata lifecycle correction
        id: source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,os
          assert os.environ['GITHUB_REF_NAME']=='codex/paint-contours-p3b-20260925'
          patch=Path('.github/p3b-metadata.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='26e2cb19651e351ddaded9f3dbd335e9059789c5d27692c8e5cefdc47185a6d7'
          entries=[]
          for block in patch.decode().split('diff --git ')[1:]:
              header,_,body=block.partition('\n');path=re.fullmatch(r'a/(\S+) b/\1',header)[1]
              before,after=re.search(r'^index ([a-f0-9]{40})\.\.([a-f0-9]{40})',body,re.M).groups()
              entries.append((path,before,after))
          assert {p for p,_,_ in entries}=={'js/core/renderer/paint_contour_runtime.js','tests/paint_contour_runtime_behavior.test.mjs','tests/e2e/ownership_retirement.spec.js'}
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          if not all(git('hash-object',p)==a for p,_,a in entries):
              for p,b,_ in entries:assert git('hash-object',p)==b,p
              subprocess.run(['git','apply','--check','--unidiff-zero','.github/p3b-metadata.patch'],check=True)
              subprocess.run(['git','apply','--index','--unidiff-zero','.github/p3b-metadata.patch'],check=True)
              for p,_,a in entries:assert git('hash-object',p)==a,p
              assert set(git('diff','--cached','--name-only').splitlines())=={p for p,_,_ in entries}
              subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: refresh contour registration after precision-only source publication'
            git push origin HEAD:codex/paint-contours-p3b-20260925
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  acceptance:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [behavior, browser, publication]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - if: matrix.lane != 'behavior'
        run: python -m pip install -r requirements-dev.lock.txt
      - if: matrix.lane == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Run scoped final acceptance
        env:
          LANE: ${{ matrix.lane }}
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/p3b-final/pages
        run: |
          python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          lane=os.environ['LANE'];root=Path('.runtime/reports/p3b-final')/lane;root.mkdir(parents=True,exist_ok=True)
          (root/'source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          checks={
            'behavior':[
              ('retirement',['npm','run','test:node:ownership-retirement']),
              ('composition',['node','--test','tests/scenario_chunk_layer_payloads_behavior.test.mjs','tests/political_collection_coverage_behavior.test.mjs','tests/political_collection_geometry_cache_behavior.test.mjs','tests/political_collection_fragment_camouflage_behavior.test.mjs','tests/scenario_spatial_chunk_selection_behavior.test.mjs']),
              ('lifecycle',['npm','run','test:node:scenario-lifecycle-runtime-behavior']),
              ('export',['node','--test','tests/export_target_resolution_behavior.test.mjs','tests/exact_composite_reuse_behavior.test.mjs']),
              ('contracts',['python','-m','unittest','tests.test_map_renderer_border_draw_owner_boundary_contract','tests.test_map_renderer_political_collection_boundary_contract','tests.test_map_renderer_public_contract.MapRendererPublicContractTest.test_public_whitelist_stays_explicit','tests.test_map_renderer_public_contract.MapRendererPublicContractTest.test_public_facade_named_imports_stay_whitelisted','-q']),
              ('city',['node','--test','tests/city_data_contract_behavior.test.mjs','tests/scenario_capitals_behavior.test.mjs']),
              ('architecture',['node','tools/check_architecture_boundaries.mjs']),
              ('writers',['node','tools/check_state_write_allowlist.mjs']),
              ('scripts',['node','tools/verification/script_portfolio.mjs','check']),
              ('inventory',['node','tools/e2e_layering.mjs','check']),
              ('imports',['node','tools/check_test_import_graph.mjs']),
              ('routes',['node','tools/select_verification_targets.mjs','--check'])],
            'browser':[('browser',['npx','playwright','test','tests/e2e/ownership_retirement.spec.js','--workers=1'])],
            'publication':[('build',['python','tools/build_pages_dist.py','--output-root','.runtime/p3b-final/pages']),('startup-shell',['python','-m','unittest','tests.test_pages_dist_startup_shell','-q'])]
          }[lane]
          results=[]
          for name,command in checks:
              print(f'::group::{name}',flush=True)
              run=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (root/f'{name}.log').write_text(run.stdout);print(run.stdout,flush=True)
              results.append({'check':name,'exit_code':run.returncode})
              (root/'checks.json').write_text(json.dumps(results,indent=2))
              print('::endgroup::',flush=True)
          if lane=='publication':
              for path in ['js/workers/paint_contour.worker.js','js/core/paint_contour_source.js']:
                  assert (Path(os.environ['SCENARIO_FORGE_PAGES_ARTIFACT_ROOT'])/path).stat().st_size>0,path
          raise SystemExit(any(r['exit_code'] for r in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3b-final-${{ matrix.lane }}
          path: |
            .runtime/reports/p3b-final
            .runtime/tests/playwright
          retention-days: 3
