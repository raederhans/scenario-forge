name: P3B acceptance
on:
  push:
    branches: [codex/p3b-acceptance-20260925]
    paths: [.github/workflows/p3b-acceptance.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 705ebbecb2ab7b3af8b493b8cb143e64dab265e0
          persist-credentials: false
          sparse-checkout: |
            js
            tests
            tools
            docs/architecture
            css
            vendor
            backend
            map_backend
            map_builder
            scenario_builder
            ops
            .github
            landing
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Package exact code and direct-import metadata
        run: |
          mkdir -p .runtime/tmp
          git rev-parse HEAD > .runtime/tmp/source-sha.txt
          git ls-tree -r HEAD > .runtime/tmp/tracked-tree.txt
          python - <<'PY'
          import subprocess
          from pathlib import Path
          for name in ['runtime_asset_registry.json','country_feature_policies.json','CATALOG.json','thematic_layers/index.json','city_lights/historical_1930_entries.json','scenarios/index.json']:
              path=Path('data')/name;path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(subprocess.check_output(['git','show',f'HEAD:{path.as_posix()}']))
          PY
          tar --exclude=./.git --exclude=./.runtime --exclude=./dist -czf .runtime/tmp/source.tgz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3b-source-review
          path: |
            .runtime/tmp/source.tgz
            .runtime/tmp/source-sha.txt
            .runtime/tmp/tracked-tree.txt
          retention-days: 2
