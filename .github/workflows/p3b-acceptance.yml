name: P3B acceptance
on:
  push:
    branches: [codex/p3b-acceptance-20260925]
    paths: [.github/workflows/p3b-acceptance.yml]
permissions:
  contents: read
jobs:
  integration-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: a8b5a4447d1ab3b28d226015647ca106c907ad3a
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact dependencies and capture real changed paths
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
          mkdir -p .runtime/reports/p3b-child-diagnostics
          git rev-parse HEAD > .runtime/reports/p3b-child-diagnostics/source-sha.txt
          git fetch --no-tags --depth=1 origin 278886451ed93b383aaee6e6a715efbec69640b2
          git diff --name-only 278886451ed93b383aaee6e6a715efbec69640b2 HEAD > .runtime/reports/p3b-child-diagnostics/changed-files.txt
      - name: Build the same Pages input required by PR contracts
        run: |
          set -o pipefail
          python tools/build_pages_dist.py --output-root .runtime/p3b-child-diagnostics/pages 2>&1 | tee .runtime/reports/p3b-child-diagnostics/build.log
      - name: Diagnose all selected child-safe contracts, preserving every failure
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/p3b-child-diagnostics/pages
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {buildRepositoryRecommendation} from './tools/select_verification_targets.mjs';
          import {buildExecutionPlan,executeAdaptivePlan} from './tools/run_adaptive_tests.mjs';
          const root='.runtime/reports/p3b-child-diagnostics';
          assert.equal(fs.readFileSync(root+'/source-sha.txt','utf8').trim(),'a8b5a4447d1ab3b28d226015647ca106c907ad3a');
          const files=fs.readFileSync(root+'/changed-files.txt','utf8').trim().split(/\r?\n/);
          const report=buildRepositoryRecommendation(files),plan=buildExecutionPlan(report);
          assert.deepEqual(report.unmatchedChangedFiles,[]);
          assert.deepEqual(plan.routeGaps,[]);
          assert.ok(plan.executionCommands.length>100);
          assert.ok(plan.executionGroups.every(group=>group.executionOwner==='child-safe'&&group.resourceLocks.length===0));
          fs.writeFileSync(root+'/selection.json',JSON.stringify(report,null,2));
          fs.writeFileSync(root+'/plan.json',JSON.stringify(plan,null,2));
          let index=0;
          const results=executeAdaptivePlan(plan,{
            continueOnFailure:true,
            runner:(bin,args,options)=>{
              const id=String(++index).padStart(3,'0');
              console.log(`::group::${id} ${bin} ${args.join(' ')}`);
              const result=spawnSync(bin,args,{...options,stdio:'pipe',encoding:'utf8',maxBuffer:64*1024*1024});
              const output=(result.stdout||'')+'\n'+(result.stderr||'');
              fs.writeFileSync(root+'/'+id+'.log',output);
              console.log(output);console.log('::endgroup::');return result;
            },
            onCheckpoint:results=>fs.writeFileSync(root+'/results.json',JSON.stringify(results,null,2))
          });
          const failures=results.map((result,index)=>({...result,log:String(index+1).padStart(3,'0')+'.log'})).filter(result=>result.status!=='passed');
          fs.writeFileSync(root+'/summary.json',JSON.stringify({source:fs.readFileSync(root+'/source-sha.txt','utf8').trim(),commands:results.length,passed:results.length-failures.length,failures,deferredMainThread:plan.mainThreadCommands},null,2));
          process.exitCode=failures.length?1:0;
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3b-child-contract-diagnostics
          path: |
            .runtime/reports/p3b-child-diagnostics/*.json
            .runtime/reports/p3b-child-diagnostics/*.log
            .runtime/reports/p3b-child-diagnostics/*.txt
          retention-days: 3
