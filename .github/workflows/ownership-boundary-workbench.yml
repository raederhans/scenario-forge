name: Ownership boundary workbench
on:
  push:
    branches: [codex/visual-editing-boundary-p1-p2-20260924]
    paths:
      - .github/workflows/ownership-boundary-workbench.yml
      - .github/apply-ownership-retirement.py
permissions:
  contents: write
concurrency:
  group: ownership-boundary-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-editing-boundary-p1-p2-20260924
          fetch-depth: 1
      - name: Apply verified source changes to isolated branch
        run: |
          python .github/apply-ownership-retirement.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: retire ownership editing and establish reference/paint data boundary (P1-P2)'
            git push origin HEAD:codex/visual-editing-boundary-p1-p2-20260924
          fi
          mkdir -p .runtime/reports/ownership-retirement
          git rev-parse HEAD > .runtime/reports/ownership-retirement/source-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact test dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
          npx playwright install --with-deps chromium
      - name: Run focused source, full-data, browser and publish artifact checks
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('.runtime/reports/ownership-retirement')
          checks = [
            ('node-retirement', ['npm','run','test:node:ownership-retirement']),
            ('node-lifecycle-full-data', ['npm','run','test:node:scenario-lifecycle-runtime-behavior']),
            ('python-boundaries', ['python','-m','unittest','tests.test_map_renderer_color_resolution_strategy_boundary_contract','tests.test_scenario_state_actions_boundary_contract','tests.test_sidebar_split_boundary_contract','-q']),
            ('state-write-boundary', ['node','tools/check_state_write_allowlist.mjs']),
            ('script-portfolio', ['node','tools/verification/script_portfolio.mjs','check']),
            ('browser-retirement', ['npx','playwright','test','tests/e2e/ownership_retirement.spec.js','tests/e2e/ui_rework_mainline_shell_sidebar.spec.js','--grep','ownership editing|desktop commands','--workers=1']),
            ('pages-build', ['python','tools/build_pages_dist.py','--output-root','.runtime/ownership-retirement/pages']),
            ('pages-startup-shell', ['python','-m','unittest','tests.test_pages_dist_startup_shell','-q']),
          ]
          env = {**os.environ, 'SCENARIO_FORGE_PAGES_ARTIFACT_ROOT': '.runtime/ownership-retirement/pages'}
          results = []
          for name, command in checks:
              print(f'::group::{name}', flush=True)
              run = subprocess.run(command, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (root / f'{name}.log').write_text(run.stdout)
              print(run.stdout, flush=True)
              results.append({'check':name, 'command':command, 'exit_code':run.returncode})
              (root / 'checks.json').write_text(json.dumps(results, indent=2))
              print('::endgroup::', flush=True)
          raise SystemExit(any(row['exit_code'] != 0 for row in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-retirement-evidence
          path: |
            .runtime/reports/ownership-retirement
            .runtime/tests/playwright
          retention-days: 3
