name: Ownership boundary workbench
on:
  push:
    branches: [codex/visual-editing-boundary-p1-p2-20260924]
    paths:
      - .github/workflows/ownership-boundary-workbench.yml
permissions:
  contents: read
concurrency:
  group: ownership-boundary-workbench
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js
            tests
            tools
            map_backend
            backend
            scenario_builder
            map_builder
            ops
            .github
            app
            css
            vendor
            docs
      - name: Package tracked source for isolated verification
        run: |
          mkdir -p .runtime/tmp
          git ls-tree -r HEAD > .runtime/tmp/tracked-tree.txt
          tar --exclude=.git --exclude=.runtime --exclude=data --exclude=dist -czf .runtime/tmp/source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: ownership-boundary-source
          path: |
            .runtime/tmp/source.tgz
            .runtime/tmp/tracked-tree.txt
          retention-days: 1
