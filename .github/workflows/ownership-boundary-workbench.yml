name: Ownership boundary workbench
on:
  push:
    branches: [codex/visual-editing-boundary-p1-p2-20260924]
    paths:
      - .github/workflows/ownership-boundary-workbench.yml
permissions:
  contents: read
concurrency:
  group: ownership-boundary-workbench
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js
            tests
            tools
      - name: Package exact metadata imported by source modules
        run: |
          mkdir -p .runtime/tmp/metadata
          for path in data/runtime_asset_registry.json data/country_feature_policies.json data/CATALOG.json data/thematic_layers/index.json data/city_lights/historical_1930_entries.json; do
            mkdir -p ".runtime/tmp/metadata/$(dirname "$path")"
            git show "HEAD:$path" > ".runtime/tmp/metadata/$path"
          done
          tar -czf .runtime/tmp/metadata.tgz -C .runtime/tmp/metadata .
      - uses: actions/upload-artifact@v4
        with:
          name: ownership-boundary-metadata
          path: .runtime/tmp/metadata.tgz
          retention-days: 1
