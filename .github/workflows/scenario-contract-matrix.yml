name: Scenario Contract Matrix

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: scenario-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Scenario Contract Plan
    runs-on: ubuntu-latest
    outputs:
      scenario_ids: ${{ steps.plan.outputs.scenario_ids }}
    steps:
      - name: Checkout planner only
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            tools/ci/pr_plan.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Resolve scenario matrix
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo 'scenario_ids=["hoi4_1936","hoi4_1939","tno_1962"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .runtime/tmp .runtime/reports/generated
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > .runtime/tmp/pr-changed-files.txt
          node tools/ci/pr_plan.mjs \
            --changed-files .runtime/tmp/pr-changed-files.txt \
            --labels "$PR_LABELS" \
            --json-out .runtime/reports/generated/scenario-pr-plan.json \
            --github-output "$GITHUB_OUTPUT"

  strict-scenario-contract-review:
    needs: [plan]
    if: needs.plan.outputs.scenario_ids != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario_id: ${{ fromJSON(needs.plan.outputs.scenario_ids) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Prepare report directory
        run: mkdir -p .runtime/reports/generated

      - name: Run strict scenario contract review (${{ matrix.scenario_id }})
        run: python tools/check_scenario_contracts.py --strict --scenario-dir data/scenarios/${{ matrix.scenario_id }} --report-path .runtime/reports/generated/${{ matrix.scenario_id }}.strict_contract_report.json

      - name: Upload strict contract report (${{ matrix.scenario_id }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.scenario_id }}-strict-contract-report
          path: .runtime/reports/generated/${{ matrix.scenario_id }}.strict_contract_report.json
