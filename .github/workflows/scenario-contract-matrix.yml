name: Scenario Contract Matrix

on:
  workflow_dispatch:
  pull_request:
  # Runs on every PR: check_scenario_contracts.py imports much of tools/ and map_builder/,
  # so a hand-kept path list would silently skip real regressions.

permissions:
  contents: read

concurrency:
  group: scenario-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  strict-scenario-contract-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario_id:
          - blank_base
          - modern_world
          - tno_1962
          - hoi4_1936
          - hoi4_1939
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Run strict scenario contract review (${{ matrix.scenario_id }})
        run: |
          mkdir -p .runtime/reports/generated
          python tools/check_scenario_contracts.py --strict --scenario-dir data/scenarios/${{ matrix.scenario_id }} --report-path .runtime/reports/generated/${{ matrix.scenario_id }}.strict_contract_report.json

      - name: Upload strict contract report (${{ matrix.scenario_id }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.scenario_id }}-strict-contract-report
          path: .runtime/reports/generated/${{ matrix.scenario_id }}.strict_contract_report.json
