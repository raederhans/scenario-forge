name: Precision transport validation
on:
  push:
    branches: ["codex/precision-transport-p5-20260924"]
    paths:
      - ".github/workflows/precision-transport-validation.yml"
      - "js/ui/transport_workbench*.js"
      - "js/core/data_service.js"
      - "tests/transport_lifetime_behavior.test.mjs"
      - "tests/data_service_cancellation_behavior.test.mjs"
      - "tools/probe_transport_lifetime.mjs"
permissions:
  contents: read
concurrency:
  group: precision-transport-validation
  cancel-in-progress: true
jobs:
  lifetimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Actual lifetime scheduler and asset wrapper behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/transport-lifetime-evidence
          node --test tests/transport_lifetime_behavior.test.mjs tests/data_service_cancellation_behavior.test.mjs tests/data_service_runtime_behavior.test.mjs 2>&1 | tee .runtime/transport-lifetime-evidence/tests.log
      - name: Existing transport behavior and source boundaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/transport-lifetime-evidence
          node --input-type=module <<'JS' 2>&1 | tee .runtime/transport-lifetime-evidence/transport.log
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const files = fs.readdirSync('tests').filter(name => /^transport_workbench.*\.test\.mjs$/.test(name)).map(name => `tests/${name}`);
          if (!files.length) throw new Error('No original transport workbench tests found');
          console.log(files);
          const result = spawnSync(process.execPath, ['--test', ...files], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          JS
          node tools/check_architecture_boundaries.mjs
          git diff --check 2b2f1fecf9c388616a01dfb10da5e372ea65b3dc HEAD
      - name: Native canonical road preview lifecycle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/transport-lifetime-evidence
          node tools/probe_transport_lifetime.mjs --report .runtime/transport-lifetime-evidence/canonical-road.json 2>&1 | tee .runtime/transport-lifetime-evidence/native.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: precision-transport-evidence
          path: .runtime/transport-lifetime-evidence/
          retention-days: 5
          if-no-files-found: warn
