name: P3B current-main acceptance
on:
  push:
    branches: [codex/p3b-acceptance-20260925]
    paths: [.github/workflows/p3b-main-integration.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/paint-contours-p3b-20260925
          fetch-depth: 50
          sparse-checkout: |
            js
            tests
            tools
      - name: Preserve both reviewed branches and resolve only the overlapping reference fixture
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          old='278886451ed93b383aaee6e6a715efbec69640b2'
          ours='e487c19927574d4050ba1760159b0de8cc8c52ba'
          main='f98c734790233bc31993506bd1761be85cea90c5'
          quick='tests/scenario_chunk_contracts.quick_cases.mjs'
          route='tests/verify_core_runner_behavior.test.mjs'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def source(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'])
          assert git('rev-parse','HEAD')==ours
          subprocess.run(['git','fetch','--no-tags','--depth=12','origin',main],check=True)
          ours_paths=set(git('diff','--name-only',old,ours).splitlines())
          main_paths=set(git('diff','--name-only',old,main).splitlines())
          assert ours_paths&main_paths=={quick,route}
          # Main fixes the same old ownership fixture. The P3B variant retains
          # that immutable baseline and additionally tests a stale-owner mirror.
          base_text=source(old,quick).decode()
          before='''      sovereigntyByFeatureId: {
                  marine_red_sea: "SOV",
                  RU_LAND: "SOV",
                  ATL_OWNER: "ATL",
                },'''.replace('                  ','        ').replace('                },','      },')
          after='''      activeScenarioId: "tno_1962",
                scenarioBaselineOwnersByFeatureId: Object.freeze({
                  marine_red_sea: "SOV",
                  RU_LAND: "SOV",
                  ATL_OWNER: "ATL",
                }),'''.replace('                  ','        ').replace('                scenario','      scenario').replace('                }),','      }),')
          assert base_text.count(before)==1
          assert base_text.replace(before,after)==source(main,quick).decode(),'Main fixture changed beyond reviewed patch'
          reviewed_quick=source(ours,quick)
          assert git('rev-parse',f'{ours}:{quick}')=='5a48ca23173c29db726a55a8ff7d51e73666d2c0'
          merge=subprocess.run(['git','merge','--no-commit','--no-ff',main])
          if merge.returncode:
            conflicts=set(git('diff','--name-only','--diff-filter=U').splitlines())
            assert conflicts=={quick},f'Unexpected concurrent conflicts: {conflicts}'
            Path(quick).write_bytes(reviewed_quick)
            subprocess.run(['git','add','--',quick],check=True)
          assert not git('diff','--name-only','--diff-filter=U')
          assert source('',quick)==reviewed_quick
          # Every non-overlapping main asset (including all binary/dist/data)
          # must be identical to main; every P3B-only change stays identical.
          for path in main_paths-ours_paths:
            assert git('rev-parse',f':{path}')==git('rev-parse',f'{main}:{path}'),path
          for path in ours_paths-main_paths:
            assert git('rev-parse',f':{path}')==git('rev-parse',f'{ours}:{path}'),path
          route_text=source('',route).decode()
          assert 'python-unittest:tests.test_tno_ownership_repairs' in route_text
          assert 'paint_contour_graph_behavior.test.mjs' in route_text
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','Merge current main data repairs while preserving contour and reference contracts'],check=True)
          subprocess.run(['git','push','origin','HEAD:codex/paint-contours-p3b-20260925'],check=True)
          root=Path('.runtime/reports/p3b-current-main');root.mkdir(parents=True,exist_ok=True)
          (root/'merge-receipt.json').write_text(json.dumps({'old_base':old,'p3b_parent':ours,'main_parent':main,'head':git('rev-parse','HEAD'),'main_paths_preserved':sorted(main_paths),'shared_reviewed_paths':[quick,route]},indent=2))
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3b-main-merge-receipt
          path: .runtime/reports/p3b-current-main
          retention-days: 3
  pristine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: f98c734790233bc31993506bd1761be85cea90c5
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - name: Record the new pristine main proof baseline without waiving failures
        run: |
          mkdir -p .runtime/reports/p3b-current-baseline
          git rev-parse HEAD > .runtime/reports/p3b-current-baseline/source-sha.txt
          set -o pipefail
          node tools/run_p4_state_writer_policy_tests.mjs --quick 2>&1 | tee .runtime/reports/p3b-current-baseline/proof.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3b-current-baseline
          path: .runtime/reports/p3b-current-baseline
          retention-days: 3
  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [integration, geometry, browser]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
      - if: matrix.lane == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Prepare exact integrated-source receipt
        env:
          LANE: ${{ matrix.lane }}
        run: |
          mkdir -p .runtime/reports/p3b-current-main/$LANE
          git rev-parse HEAD > .runtime/reports/p3b-current-main/$LANE/source-sha.txt
          git fetch --no-tags --depth=1 origin f98c734790233bc31993506bd1761be85cea90c5
          git diff --name-only f98c734790233bc31993506bd1761be85cea90c5 HEAD > .runtime/reports/p3b-current-main/$LANE/changed-files.txt
      - name: Verify current geometry and incoming data repairs
        if: matrix.lane == 'geometry'
        run: |
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          root=Path('.runtime/reports/p3b-current-main/geometry');results=[]
          for name,command in [('geometry',['node','tools/audit_paint_contours.mjs']),('data-repairs',['python','-m','unittest','tests.test_hoi4_territory_regressions','tests.test_tno_ownership_repairs','-q']),('capitals',['node','--test','tests/city_data_contract_behavior.test.mjs','tests/scenario_capitals_behavior.test.mjs'])]:
            run=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT);(root/f'{name}.log').write_text(run.stdout);print(run.stdout,flush=True)
            results.append({'check':name,'exit_code':run.returncode});(root/'checks.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(any(row['exit_code'] for row in results))
          PY
      - name: Verify actual Modern World and TNO browser contours against current data
        if: matrix.lane == 'browser'
        run: |
          set -o pipefail
          npx playwright test tests/e2e/ownership_retirement.spec.js --workers=1 2>&1 | tee .runtime/reports/p3b-current-main/browser/browser.log
      - name: Build exact integrated-source Pages artifact
        if: matrix.lane == 'integration'
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/p3b-current-main/pages
        run: |
          set -o pipefail
          python tools/build_pages_dist.py --output-root .runtime/p3b-current-main/pages 2>&1 | tee .runtime/reports/p3b-current-main/integration/build.log
          python -m unittest tests.test_pages_dist_startup_shell -q 2>&1 | tee .runtime/reports/p3b-current-main/integration/startup-shell.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          result=[]
          for path in ['js/workers/paint_contour.worker.js','js/core/paint_contour_worker_client.js','js/core/worker_task_client.js','js/core/paint_contour_source.js','js/core/renderer/paint_contour_graph.js','js/core/renderer/paint_contour_runtime.js','js/core/renderer/paint_contour_mesh.js']:
            source=Path(path).read_bytes();published=(Path('.runtime/p3b-current-main/pages/app')/path).read_bytes();assert source==published,path
            result.append({'path':path,'sha256':hashlib.sha256(source).hexdigest(),'size':len(source)})
          Path('.runtime/reports/p3b-current-main/integration/published-files.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Execute all selected current-main child contracts with full failure accounting
        if: matrix.lane == 'integration'
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/p3b-current-main/pages
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {spawnSync} from 'node:child_process';
          import {buildRepositoryRecommendation} from './tools/select_verification_targets.mjs';
          import {buildExecutionPlan,executeAdaptivePlan} from './tools/run_adaptive_tests.mjs';
          const root='.runtime/reports/p3b-current-main/integration';
          const files=fs.readFileSync(root+'/changed-files.txt','utf8').trim().split(/\r?\n/);
          const report=buildRepositoryRecommendation(files),plan=buildExecutionPlan(report);
          assert.deepEqual(report.unmatchedChangedFiles,[]);assert.deepEqual(plan.routeGaps,[]);
          assert.ok(plan.executionGroups.every(group=>group.executionOwner==='child-safe'&&group.resourceLocks.length===0));
          fs.writeFileSync(root+'/selection.json',JSON.stringify(report,null,2));fs.writeFileSync(root+'/plan.json',JSON.stringify(plan,null,2));
          let index=0;
          const results=executeAdaptivePlan(plan,{continueOnFailure:true,runner:(bin,args,options)=>{
            const id=String(++index).padStart(3,'0');console.log(`::group::${id} ${bin} ${args.join(' ')}`);
            const result=spawnSync(bin,args,{...options,stdio:'pipe',encoding:'utf8',maxBuffer:64*1024*1024});
            const output=(result.stdout||'')+'\n'+(result.stderr||'');fs.writeFileSync(root+'/'+id+'.log',output);console.log(output);console.log('::endgroup::');return result;
          },onCheckpoint:results=>fs.writeFileSync(root+'/results.json',JSON.stringify(results,null,2))});
          const failures=results.map((result,index)=>({...result,log:String(index+1).padStart(3,'0')+'.log'})).filter(result=>result.status!=='passed');
          fs.writeFileSync(root+'/summary.json',JSON.stringify({source:fs.readFileSync(root+'/source-sha.txt','utf8').trim(),base:'f98c734790233bc31993506bd1761be85cea90c5',commands:results.length,passed:results.length-failures.length,failures,deferredMainThread:plan.mainThreadCommands},null,2));
          process.exitCode=failures.length?1:0;
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3b-current-main-${{ matrix.lane }}
          path: |
            .runtime/reports/p3b-current-main
            .runtime/reports/p3b-geometry
            .runtime/tests/playwright
          retention-days: 3
