name: Raster release regression

on:
  pull_request:
    paths:
      - '.github/workflows/raster-release-regression.yml'
      - 'tools/political_id_raster_app_session.mjs'
      - 'tools/verify_political_id_raster_integration.mjs'
      - 'js/core/renderer/political_id_raster*'
      - 'tests/e2e/release/pages_public_release_gate.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raster-release-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tno-cache-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
      SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/raster-release/dist
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install build and browser dependencies
        run: |
          python -m pip install -r requirements-ci-min.lock.txt
          npm ci
          npx --no-install playwright install chromium

      - name: Record exact regression environment
        run: |
          mkdir -p .runtime/reports/generated/raster-release-regression
          node --input-type=module <<'JS' > .runtime/reports/generated/raster-release-regression/environment.json
          import {readFileSync} from 'node:fs';
          const packageVersion=path=>JSON.parse(readFileSync(path,'utf8')).version;
          const browsers=JSON.parse(readFileSync('node_modules/playwright-core/browsers.json','utf8')).browsers;
          console.log(JSON.stringify({sourceSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,
            runAttempt:process.env.GITHUB_RUN_ATTEMPT,node:process.version,
            playwright:packageVersion('node_modules/playwright/package.json'),
            chromium:browsers.filter(browser=>browser.name.startsWith('chromium')),
            launch:{headless:true},viewport:{width:1280,height:900},dpr:2},null,2));
          JS

      - name: Build source Pages artifact
        run: |
          mkdir -p .runtime/raster-release
          python tools/build_pages_dist.py --output-root "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT" 2>&1 | tee .runtime/raster-release/build.log

      - name: Run original TNO release stages
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT" > .runtime/raster-release/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          # Match the original serial suite's five stages, never the large
          # native fallback profile or the public deployed URL gate.
          npm run test:e2e:pages-public-release-gate -- --grep 'public Pages raster tno_1962 (cold startup and native references|timeout recovery and exact zoom|paint and continuous brush history|normal startup cache baseline|persistent cache revisit)$' 2>&1 | tee .runtime/raster-release/regression.log

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raster-release-regression-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .runtime/raster-release/*.log
            .runtime/reports/generated/raster-release-regression/
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/
