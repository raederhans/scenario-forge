name: perf-pr-gate

on:
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: perf-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run_perf: ${{ steps.classify.outputs.should_run_perf }}
      should_enforce_regressions: ${{ steps.classify.outputs.should_enforce_regressions }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}
      diff_head_sha: ${{ steps.classify.outputs.diff_head_sha }}
    steps:
      # Sparse checkout uses checkout's blob:none filter; fetch all commit history
      # so the PR merge base is available without downloading map asset blobs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json

      # 分类结果同时决定是否测量与是否阻断回归，生成的审计文件是后续复核这两个决定的真相源。
      - name: Classify perf-relevant changes
        id: classify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.runtime/reports/generated' | Out-Null

          function Convert-GlobToRegex([string]$pattern) {
            $normalized = $pattern.Replace('\', '/')
            $escaped = [Regex]::Escape($normalized)
            $escaped = $escaped.Replace('\*\*', '.*')
            $escaped = $escaped.Replace('\*', '[^/]*')
            $escaped = $escaped.Replace('\?', '[^/]')
            return "(?s)^$escaped$"
          }

          $eventPayload = Get-Content -Raw -Path $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $forceMeasurement = $env:GITHUB_EVENT_NAME -in @('schedule', 'workflow_dispatch')
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseSha = $eventPayload.pull_request.base.sha
            $diffHeadSha = $eventPayload.pull_request.head.sha
          } else {
            $diffHeadSha = (git rev-parse HEAD).Trim()
            $baseSha = git rev-parse 'HEAD^'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve parent for scheduled/manual perf baseline' }
          }
          $candidateSha = (git rev-parse HEAD).Trim()

          if (-not $baseSha -or -not $diffHeadSha -or -not $candidateSha -or $baseSha -match '^0+$') {
            throw 'Unable to resolve base, diff head or checked-out candidate SHA for perf gate classifier'
          }
          foreach ($sha in @($baseSha, $diffHeadSha, $candidateSha)) {
            git cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Missing classifier commit: $sha" }
          }

          $diffRange = "$baseSha...$diffHeadSha"
          # Disable rename detection: include both old and new paths without
          # fetching asset contents. NUL records preserve Unicode and newlines.
          $diffPath = Join-Path (Get-Location) '.runtime/reports/generated/perf-changed-paths.bin'
          git diff --name-only --no-renames -z "--output=$diffPath" $diffRange -- 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve perf classifier diff' }
          $changedFiles = @([IO.File]::ReadAllText($diffPath).Split([char]0) | Where-Object { $_ -ne '' })

          # Only isolated test/verification script edits are exempt. Unknown manifest
          # fields, lifecycle scripts, referenced scripts and parse failures still measure.
          $packageRequiresPerf = $true
          if ('package.json' -in $changedFiles) {
            try {
              $basePackageText = git show "${baseSha}:package.json"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to read base package.json' }
              $headPackageText = git show "${diffHeadSha}:package.json"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to read head package.json' }
              $basePackage = ($basePackageText -join "`n") | ConvertFrom-Json -AsHashtable -ErrorAction Stop
              $headPackage = ($headPackageText -join "`n") | ConvertFrom-Json -AsHashtable -ErrorAction Stop
              $baseScripts = $basePackage.scripts
              $headScripts = $headPackage.scripts
              if ($baseScripts -isnot [System.Collections.IDictionary] -or $headScripts -isnot [System.Collections.IDictionary]) {
                throw 'Missing scripts object'
              }
              $basePackage.Remove('scripts')
              $headPackage.Remove('scripts')
              $packageRequiresPerf = ($basePackage | ConvertTo-Json -Depth 100 -Compress) -cne ($headPackage | ConvertTo-Json -Depth 100 -Compress)
              foreach ($scriptName in @(@($baseScripts.Keys) + @($headScripts.Keys) | Sort-Object -Unique)) {
                if ($baseScripts[$scriptName] -ceq $headScripts[$scriptName]) { continue }
                if ($scriptName -notmatch '^(test:|verify:)' -or "$scriptName $($baseScripts[$scriptName]) $($headScripts[$scriptName])" -match 'perf|benchmark') {
                  $packageRequiresPerf = $true
                }
                foreach ($command in @($baseScripts.Values) + @($headScripts.Values)) {
                  if ($command -match [Regex]::Escape($scriptName)) { $packageRequiresPerf = $true }
                }
              }
            } catch {
              $packageRequiresPerf = $true
            }
          }

          $rules = @(
            @{
              name = 'perf-workflow'
              reason = 'perf gate workflow changed'
              regression_policy = 'diagnostic'
              patterns = @('.github/workflows/perf-pr-gate.yml')
            },
            @{
              name = 'perf-baseline-docs'
              reason = 'perf baseline or non-Markdown perf asset changed'
              regression_policy = 'diagnostic'
              patterns = @('docs/perf/**')
            },
            @{
              name = 'runtime-js'
              reason = 'runtime JavaScript can change measured behavior'
              regression_policy = 'enforce'
              patterns = @('js/**')
            },
            @{
              name = 'app-shell'
              reason = 'app shell markup or styles can change startup and rendering behavior'
              regression_policy = 'enforce'
              patterns = @('index.html', 'css/**', 'vendor/**')
            },
            @{
              name = 'scenario-registry'
              reason = 'scenario registry can change startup selection and measured scenario inputs'
              regression_policy = 'diagnostic'
              patterns = @('data/scenarios/index.json')
            },
            @{
              name = 'perf-scenario-data'
              reason = 'measured scenario data changed'
              regression_policy = 'diagnostic'
              patterns = @('data/scenarios/tno_1962/**', 'data/scenarios/hoi4_1939/**')
            },
            @{
              name = 'playwright-app-support'
              reason = 'playwright app support affects perf harness'
              regression_policy = 'diagnostic'
              patterns = @('tests/e2e/support/**', 'playwright.config.cjs')
            },
            @{
              name = 'perf-tools'
              reason = 'perf tooling changed'
              regression_policy = 'diagnostic'
              patterns = @('tools/perf/**')
            },
            @{
              name = 'dev-server'
              reason = 'dev server behavior affects perf runs'
              regression_policy = 'diagnostic'
              patterns = @('tools/dev_server.py')
            },
            @{
              name = 'node-manifests'
              reason = 'dependency manifest can affect perf gate environment'
              regression_policy = 'diagnostic'
              patterns = @('package.json', 'package-lock.json', 'requirements-perf.lock.txt')
            }
          )

          $ruleHits = @()
          foreach ($rule in $rules) {
            $regexes = @($rule.patterns | ForEach-Object { Convert-GlobToRegex $_ })
            $matchedFilesForRule = @(
              $changedFiles |
                Where-Object {
                  $file = $_
                  ($regexes | Where-Object { $file -match $_ } | Select-Object -First 1) -and
                    -not ($rule.name -eq 'perf-baseline-docs' -and $file -match '\.md$') -and
                    -not ($file -eq 'package.json' -and -not $packageRequiresPerf)
                } |
                Sort-Object -Unique
            )

            if ($matchedFilesForRule.Count -gt 0) {
              $ruleHits += [ordered]@{
                name = $rule.name
                reason = $rule.reason
                regression_policy = $rule.regression_policy
                patterns = $rule.patterns
                files = $matchedFilesForRule
              }
            }
          }

          $matchedRuleNames = @($ruleHits | ForEach-Object { $_.name })
          $regressionEnforcementRuleHits = @(
            $ruleHits |
              Where-Object { $_.regression_policy -eq 'enforce' } |
              ForEach-Object { $_.name }
          )
          $shouldEnforceRegressions = $forceMeasurement -or $regressionEnforcementRuleHits.Count -gt 0
          $shouldRunPerf = $forceMeasurement -or $ruleHits.Count -gt 0
          if ($forceMeasurement) {
            $reason = "run npm run perf:gate for $($env:GITHUB_EVENT_NAME), regardless of changed paths"
          } elseif ($shouldRunPerf) {
            $reason = "run npm run perf:gate because matched rules: $($matchedRuleNames -join ', ')"
          } elseif ($changedFiles.Count -eq 0) {
            $reason = 'skip npm run perf:gate because no changed files were detected in the PR diff'
          } else {
            $reason = 'skip npm run perf:gate because no perf-related classifier rules matched'
          }

          # 三个 SHA 分别绑定比较基线、事件目标和实际 checkout，避免审计记录把 GitHub 事件身份混为一谈。
          $audit = [ordered]@{
            base_sha = $baseSha
            diff_head_sha = $diffHeadSha
            candidate_sha = $candidateSha
            changed_files = $changedFiles
            matched_rules = $ruleHits
            should_run_perf = $shouldRunPerf
            forced_measurement = $forceMeasurement
            should_enforce_regressions = $shouldEnforceRegressions
            regression_enforcement_rules = $regressionEnforcementRuleHits
            reason = $reason
          }

          $auditJsonPath = '.runtime/reports/generated/perf-pr-gate-classifier.json'
          $auditMdPath = '.runtime/reports/generated/perf-pr-gate-classifier.md'
          $audit | ConvertTo-Json -Depth 8 | Set-Content -Path $auditJsonPath

          $changedFileLines = if ($changedFiles.Count -gt 0) {
            ($changedFiles | ForEach-Object { '- `' + $_ + '`' }) -join "`n"
          } else {
            '- _none_'
          }

          $matchedRuleLines = if ($ruleHits.Count -gt 0) {
            ($ruleHits | ForEach-Object {
              $patterns = ($_.patterns | ForEach-Object { '`' + $_ + '`' }) -join ', '
              $files = ($_.files | ForEach-Object { '`' + $_ + '`' }) -join ', '
              ('- `' + $_.name + '` — ' + $_.reason + "`n  - patterns: $patterns`n  - files: $files")
            }) -join "`n"
          } else {
            '- _none_'
          }

          $summary = @(
            '## Perf classifier audit'
            "- should run perf gate: $($shouldRunPerf.ToString().ToLowerInvariant())"
            "- should enforce performance regressions: $($shouldEnforceRegressions.ToString().ToLowerInvariant())"
            "- reason: $reason"
            ''
            '### Changed files'
            $changedFileLines
            ''
            '### Matched rules'
            $matchedRuleLines
          ) -join "`n"
          Set-Content -Path $auditMdPath -Value $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          "should_run_perf=$($shouldRunPerf.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_enforce_regressions=$($shouldEnforceRegressions.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base_sha=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "diff_head_sha=$diffHeadSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate_sha=$candidateSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload perf classifier audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-pr-gate-classifier-audit
          path: .runtime/reports/generated/perf-pr-gate-classifier.*

  perf-scenarios:
    name: perf-scenario (${{ matrix.scenario }})
    needs: [classify]
    if: needs.classify.outputs.should_run_perf == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [tno_1962, hoi4_1939]
    env:
      PERF_SCENARIO: ${{ matrix.scenario }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/browser/ms-playwright
      PERF_DEV_SERVER_READY_TIMEOUT_MS: "90000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.classify.outputs.candidate_sha }}
          fetch-depth: 50

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.should_run_perf == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.classify.outputs.should_run_perf == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-perf.lock.txt

      - name: Install Node dependencies
        if: needs.classify.outputs.should_run_perf == 'true'
        run: npm ci

      - name: Install Python performance dependencies
        if: needs.classify.outputs.should_run_perf == 'true'
        run: |
          python -m pip install --no-deps -r requirements-perf.lock.txt
          python -m pip check
          python -c "import tools.dev_server"

      - name: Cache Playwright Chromium
        if: needs.classify.outputs.should_run_perf == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Chromium
        if: needs.classify.outputs.should_run_perf == 'true'
        run: npx playwright install chromium

      - name: Generate same-runner base baseline
        if: needs.classify.outputs.should_run_perf == 'true'
        shell: pwsh
        run: |
          $baseSha = '${{ needs.classify.outputs.base_sha }}'
          $candidateSha = '${{ needs.classify.outputs.candidate_sha }}'
          if (-not $baseSha -or -not $candidateSha) {
            throw 'Missing base or candidate SHA for same-runner performance baseline'
          }

          $baseWorktree = Join-Path $env:GITHUB_WORKSPACE '.runtime/tmp/perf-pr-gate-base'
          $baselineJson = Join-Path $env:GITHUB_WORKSPACE '.runtime/output/perf/perf-pr-gate-base.json'
          $baselineRawDir = Join-Path $env:GITHUB_WORKSPACE '.runtime/output/perf/perf-pr-gate-base-raw'
          $baseEvidenceDir = Join-Path $env:GITHUB_WORKSPACE '.runtime/output/perf/perf-pr-gate-base-evidence'
          $projectionReceipt = Join-Path $env:GITHUB_WORKSPACE '.runtime/output/perf/perf-pr-gate-base-projection.json'
          $candidateHarness = Join-Path $env:GITHUB_WORKSPACE 'tools/perf/run_baseline.mjs'
          New-Item -ItemType Directory -Force -Path (Split-Path $baselineJson), $baselineRawDir, $baseEvidenceDir | Out-Null

          git cat-file -e "$baseSha^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags --depth=1 origin $baseSha
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch same-runner baseline commit' }
          }
          git worktree add --detach $baseWorktree $baseSha
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create base worktree for $baseSha"
          }

          try {
            # base 代码搭配 candidate 的测量工具、依赖与场景输入，使同 runner 对比只保留产品代码差异。
            $governedHeadInputs = @(
              'package.json'
              'package-lock.json'
              'requirements-perf.lock.txt'
              'data/scenarios/index.json'
              'data/scenarios/tno_1962'
              'data/scenarios/hoi4_1939'
              'tools/dev_server.py'
            )
            git -C $baseWorktree restore --source=$candidateSha --staged --worktree -- $governedHeadInputs
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to project governed head inputs into the base worktree'
            }

            $projectedChangedFiles = @(
              git -C $baseWorktree diff --cached --name-only |
                ForEach-Object { $_.Trim().Replace('\', '/') } |
                Where-Object { $_ }
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to enumerate projected base inputs'
            }
            $unexpectedProjectedFiles = @(
              $projectedChangedFiles |
                Where-Object {
                  $changedPath = $_
                  -not ($governedHeadInputs | Where-Object {
                    $governedPath = $_
                    $changedPath -eq $governedPath -or $changedPath.StartsWith("$governedPath/")
                  } | Select-Object -First 1)
                }
            )
            if ($unexpectedProjectedFiles.Count -gt 0) {
              throw "Projected base contains non-governed paths: $($unexpectedProjectedFiles -join ', ')"
            }

            $projectedBaseSha = $baseSha
            if ($projectedChangedFiles.Count -gt 0) {
              $projectionMessage = "perf: synthesize governed base measurement tree`n`nbase=$baseSha`ncandidate=$candidateSha"
              git -C $baseWorktree -c user.name=scenario-forge-perf-gate -c user.email=scenario-forge-perf-gate@users.noreply.github.com commit --no-verify --no-gpg-sign -m $projectionMessage
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to commit the governed base projection'
              }
              $projectedBaseSha = (git -C $baseWorktree rev-parse HEAD).Trim()
            }

            git -C $baseWorktree diff --quiet $candidateSha -- $governedHeadInputs
            if ($LASTEXITCODE -ne 0) {
              throw 'Projected base inputs do not exactly match the candidate tree'
            }
            $projectedStatus = @(git -C $baseWorktree status --porcelain)
            if ($LASTEXITCODE -ne 0 -or $projectedStatus.Count -gt 0) {
              throw 'Projected base measurement tree is not clean'
            }
            [ordered]@{
              base_sha = $baseSha
              candidate_sha = $candidateSha
              projected_base_sha = $projectedBaseSha
              governed_head_inputs = $governedHeadInputs
              projected_changed_files = $projectedChangedFiles
            } | ConvertTo-Json -Depth 5 | Set-Content -Path $projectionReceipt

            Push-Location $baseWorktree
            try {
              npm ci
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to install base worktree dependencies'
              }
              npx playwright install chromium
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to install base worktree Chromium'
              }
              $maxAdmissionAttempts = 3
              $perfExitCode = 1
              for ($attempt = 1; $attempt -le $maxAdmissionAttempts; $attempt += 1) {
                node $candidateHarness --measured-repo-root $baseWorktree --mode baseline --scenarios $env:PERF_SCENARIO --scenario-shard $env:PERF_SCENARIO --runs 5 --warmups 3 --write-markdown false --baseline-json $baselineJson --raw-dir $baselineRawDir
                $perfExitCode = $LASTEXITCODE
                if ($perfExitCode -eq 0) {
                  break
                }
                if ($perfExitCode -ne 3 -or $attempt -eq $maxAdmissionAttempts) {
                  break
                }
                Write-Warning "Base performance admission rejected on attempt $attempt; retrying after a quiet window."
                Start-Sleep -Seconds 20
              }
              if ($perfExitCode -ne 0) {
                throw 'Failed to generate same-runner base baseline'
              }
            } finally {
              Pop-Location
            }
          } finally {
            # 临时 base worktree 删除前先复制服务日志和浏览器诊断，失败证据才能随 artifact 保留下来。
            $baseEvidenceSources = @(
              (Join-Path $baseWorktree '.runtime/tmp/perf-baseline-dev-server.out.log')
              (Join-Path $baseWorktree '.runtime/tmp/perf-baseline-dev-server.err.log')
              (Join-Path $baseWorktree '.runtime/tests/playwright/perf-baseline')
            )
            foreach ($source in $baseEvidenceSources) {
              if (Test-Path -LiteralPath $source) {
                Copy-Item -LiteralPath $source -Destination $baseEvidenceDir -Recurse -Force
              }
            }
            git worktree remove --force $baseWorktree
          }

      - name: Run perf gate
        if: needs.classify.outputs.should_run_perf == 'true'
        shell: pwsh
        run: |
          $regressionMode = if ('${{ needs.classify.outputs.should_enforce_regressions }}' -eq 'true') {
            'enforce'
          } else {
            'diagnostic'
          }
          $maxAdmissionAttempts = 3
          $perfExitCode = 1
          for ($attempt = 1; $attempt -le $maxAdmissionAttempts; $attempt += 1) {
            npm run perf:gate -- --scenarios $env:PERF_SCENARIO --scenario-shard $env:PERF_SCENARIO --regression-mode $regressionMode --baseline-json .runtime/output/perf/perf-pr-gate-base.json --raw-dir .runtime/output/perf/perf-pr-gate-current
            $perfExitCode = $LASTEXITCODE
            if ($perfExitCode -eq 0) {
              break
            }
            if ($perfExitCode -ne 3 -or $attempt -eq $maxAdmissionAttempts) {
              break
            }
            Write-Warning "Candidate performance admission rejected on attempt $attempt; retrying after a quiet window."
            Start-Sleep -Seconds 20
          }
          if ($perfExitCode -ne 0) {
            exit $perfExitCode
          }

      - name: Upload perf evidence
        if: always() && needs.classify.outputs.should_run_perf == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-pr-gate-evidence-${{ matrix.scenario }}
          if-no-files-found: ignore
          path: |
            .runtime/output/perf/**
            .runtime/tmp/perf-baseline-dev-server.*.log
            .runtime/tests/playwright/**

  perf-gate:
    name: perf-gate
    if: always()
    needs: [classify, perf-scenarios]
    runs-on: ubuntu-latest
    steps:
      - name: Require both scenario comparisons
        env:
          PERF_SCENARIO_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.PERF_SCENARIO_RESULTS);
          const classification = results.classify;
          const decision = classification?.outputs?.should_run_perf;
          const matrixResult = results['perf-scenarios']?.result;
          const passed = Object.keys(results).length === 2 && classification?.result === 'success' && (
            (decision === 'false' && matrixResult === 'skipped') ||
            (decision === 'true' && matrixResult === 'success')
          );
          if (!passed) {
            console.error('A valid classification and its required scenario outcome are required.', results);
            process.exit(1);
          }
          console.log(decision === 'false' ? 'Classifier explicitly exempted this change.' : 'Both scenario comparisons succeeded.');
          NODE
