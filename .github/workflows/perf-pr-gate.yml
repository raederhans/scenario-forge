name: perf-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: perf-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run_perf: ${{ steps.classify.outputs.should_run_perf }}
      required_for_merge: ${{ steps.classify.outputs.required_for_merge }}
      diagnostic_only: ${{ steps.classify.outputs.diagnostic_only }}
      should_enforce_regressions: ${{ steps.classify.outputs.should_enforce_regressions }}
      perf_mode: ${{ steps.classify.outputs.perf_mode }}
      scenario_matrix: ${{ steps.classify.outputs.scenario_matrix }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      candidate_sha: ${{ steps.classify.outputs.candidate_sha }}
      diff_head_sha: ${{ steps.classify.outputs.diff_head_sha }}
    steps:
      # Sparse checkout uses checkout's blob:none filter; fetch all commit history
      # so the PR merge base is available without downloading map asset blobs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /tools/ci/perf_policy.mjs

      # 分类结果同时决定是否测量与是否阻断回归，生成的审计文件是后续复核这两个决定的真相源。
      - name: Classify perf-relevant changes
        id: classify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.runtime/reports/generated' | Out-Null

          function Convert-GlobToRegex([string]$pattern) {
            $normalized = $pattern.Replace('\', '/')
            $escaped = [Regex]::Escape($normalized)
            $escaped = $escaped.Replace('\*\*', '.*')
            $escaped = $escaped.Replace('\*', '[^/]*')
            $escaped = $escaped.Replace('\?', '[^/]')
            return "(?s)^$escaped$"
          }

          $eventPayload = Get-Content -Raw -Path $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $forceMeasurement = $env:GITHUB_EVENT_NAME -in @('schedule', 'workflow_dispatch')
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseSha = $eventPayload.pull_request.base.sha
            $diffHeadSha = $eventPayload.pull_request.head.sha
          } else {
            $diffHeadSha = (git rev-parse HEAD).Trim()
            $baseSha = git rev-parse 'HEAD^'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve parent for scheduled/manual perf baseline' }
          }
          $candidateSha = (git rev-parse HEAD).Trim()

          if (-not $baseSha -or -not $diffHeadSha -or -not $candidateSha -or $baseSha -match '^0+$') {
            throw 'Unable to resolve base, diff head or checked-out candidate SHA for perf gate classifier'
          }
          foreach ($sha in @($baseSha, $diffHeadSha, $candidateSha)) {
            git cat-file -e "$sha^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Missing classifier commit: $sha" }
          }

          $diffRange = "$baseSha...$diffHeadSha"
          # Disable rename detection: include both old and new paths without
          # fetching asset contents. NUL records preserve Unicode and newlines.
          $diffPath = Join-Path (Get-Location) '.runtime/reports/generated/perf-changed-paths.bin'
          git diff --name-only --no-renames -z "--output=$diffPath" $diffRange -- 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve perf classifier diff' }
          $changedFiles = @([IO.File]::ReadAllText($diffPath).Split([char]0) | Where-Object { $_ -ne '' })

          # Shared policy compares the event's specified base SHA, not merge base.
          # Read failures stay conservative; the Node helper owns script exemptions.
          $basePackageText = $null
          $headPackageText = $null
          if ('package.json' -in $changedFiles) {
            try {
              $basePackageLines = git show "${baseSha}:package.json"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to read base package.json' }
              $headPackageLines = git show "${diffHeadSha}:package.json"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to read head package.json' }
              $basePackageText = $basePackageLines -join "`n"
              $headPackageText = $headPackageLines -join "`n"
            } catch {
              $basePackageText = $null
              $headPackageText = $null
            }
          }
          $labels = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $labels = @($eventPayload.pull_request.labels | ForEach-Object { [string]$_.name })
          }
          $policyInput = '.runtime/reports/generated/perf-policy-input.json'
          [ordered]@{ changedFiles = @($changedFiles); labels = @($labels)
            force = [bool]$forceMeasurement; basePackageText = $basePackageText; headPackageText = $headPackageText
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $policyInput
          $policyJson = node tools/ci/perf_policy.mjs $policyInput
          if ($LASTEXITCODE -ne 0) { throw 'Shared performance policy failed' }
          $policy = ($policyJson -join "`n") | ConvertFrom-Json
          $ruleHits = @($policy.matched_rules)
          $matchedRuleNames = @($ruleHits | ForEach-Object { $_.name })
          $regressionEnforcementRuleHits = @($policy.regression_enforcement_rules)
          $shouldRunPerf = [bool]$policy.should_run_perf
          $requiredForMerge = [bool]$policy.required_for_merge
          $diagnosticOnly = [bool]$policy.diagnostic_only
          $perfMode = [string]$policy.perf_mode
          $shouldEnforceRegressions = [bool]$policy.should_enforce_regressions
          $expectedPerformanceChange = [bool]$policy.expected_performance_change
          [string[]]$scenarioMatrix = @($policy.scenario_matrix)
          if ($forceMeasurement) {
            $reason = "run npm run perf:gate for $($env:GITHUB_EVENT_NAME), regardless of changed paths"
          } elseif ($shouldRunPerf) {
            $reason = "run npm run perf:gate because matched rules: $($matchedRuleNames -join ', ')"
          } elseif ($changedFiles.Count -eq 0) {
            $reason = 'skip npm run perf:gate because no changed files were detected in the PR diff'
          } else {
            $reason = 'skip npm run perf:gate because no perf-related classifier rules matched'
          }

          # 三个 SHA 分别绑定比较基线、事件目标和实际 checkout，避免审计记录把 GitHub 事件身份混为一谈。
          $audit = [ordered]@{
            base_sha = $baseSha
            diff_head_sha = $diffHeadSha
            candidate_sha = $candidateSha
            changed_files = $changedFiles
            matched_rules = $ruleHits
            should_run_perf = $shouldRunPerf
            required_for_merge = $requiredForMerge
            diagnostic_only = $diagnosticOnly
            perf_mode = $perfMode
            scenario_matrix = $scenarioMatrix
            labels = $labels
            expected_performance_change = $expectedPerformanceChange
            forced_measurement = $forceMeasurement
            should_enforce_regressions = $shouldEnforceRegressions
            regression_enforcement_rules = $regressionEnforcementRuleHits
            reason = $reason
          }

          $auditJsonPath = '.runtime/reports/generated/perf-pr-gate-classifier.json'
          $auditMdPath = '.runtime/reports/generated/perf-pr-gate-classifier.md'
          $audit | ConvertTo-Json -Depth 8 | Set-Content -Path $auditJsonPath

          $changedFileLines = if ($changedFiles.Count -gt 0) {
            ($changedFiles | ForEach-Object { '- `' + $_ + '`' }) -join "`n"
          } else {
            '- _none_'
          }

          $matchedRuleLines = if ($ruleHits.Count -gt 0) {
            ($ruleHits | ForEach-Object {
              $patterns = ($_.patterns | ForEach-Object { '`' + $_ + '`' }) -join ', '
              $files = ($_.files | ForEach-Object { '`' + $_ + '`' }) -join ', '
              ('- `' + $_.name + '` — ' + $_.reason + "`n  - patterns: $patterns`n  - files: $files")
            }) -join "`n"
          } else {
            '- _none_'
          }

          $summary = @(
            '## Perf classifier audit'
            "- should run perf gate: $($shouldRunPerf.ToString().ToLowerInvariant())"
            "- required for merge: $($requiredForMerge.ToString().ToLowerInvariant())"
            "- diagnostic only: $($diagnosticOnly.ToString().ToLowerInvariant())"
            "- performance mode: $perfMode"
            "- scenarios: $($scenarioMatrix -join ', ')"
            "- should enforce performance regressions: $($shouldEnforceRegressions.ToString().ToLowerInvariant())"
            "- reason: $reason"
            ''
            '### Changed files'
            $changedFileLines
            ''
            '### Matched rules'
            $matchedRuleLines
          ) -join "`n"
          Set-Content -Path $auditMdPath -Value $summary
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          "should_run_perf=$($shouldRunPerf.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_enforce_regressions=$($shouldEnforceRegressions.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "required_for_merge=$($requiredForMerge.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "diagnostic_only=$($diagnosticOnly.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "perf_mode=$perfMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $scenarioMatrixJson = ConvertTo-Json -InputObject @($scenarioMatrix) -Compress
          "scenario_matrix=$scenarioMatrixJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base_sha=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "diff_head_sha=$diffHeadSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "candidate_sha=$candidateSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload perf classifier audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-pr-gate-classifier-audit
          path: .runtime/reports/generated/perf-pr-gate-classifier.*

  perf-scenarios:
    needs: [classify]
    if: needs.classify.outputs.required_for_merge == 'true'
    uses: ./.github/workflows/perf-measure.yml
    with:
      perf_mode: ${{ needs.classify.outputs.perf_mode }}
      scenario_matrix: ${{ needs.classify.outputs.scenario_matrix }}
      base_sha: ${{ needs.classify.outputs.base_sha }}
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}
      should_enforce_regressions: ${{ needs.classify.outputs.should_enforce_regressions == 'true' }}
      measurement_lane: perf-required-scenario

  perf-observation:
    needs: [classify]
    if: needs.classify.outputs.diagnostic_only == 'true'
    uses: ./.github/workflows/perf-measure.yml
    with:
      perf_mode: ${{ needs.classify.outputs.perf_mode }}
      scenario_matrix: ${{ needs.classify.outputs.scenario_matrix }}
      base_sha: ${{ needs.classify.outputs.base_sha }}
      candidate_sha: ${{ needs.classify.outputs.candidate_sha }}
      should_enforce_regressions: ${{ needs.classify.outputs.should_enforce_regressions == 'true' }}
      measurement_lane: perf-observation-scenario

  perf-gate:
    name: perf-gate
    if: always()
    needs: [classify, perf-scenarios]
    runs-on: ubuntu-latest
    steps:
      - name: Require classified merge measurements
        env:
          PERF_SCENARIO_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.PERF_SCENARIO_RESULTS);
          const classification = results.classify;
          const outputs = classification?.outputs ?? {};
          const { should_run_perf: run, required_for_merge: required, diagnostic_only: diagnostic,
            perf_mode: mode, should_enforce_regressions: enforce, scenario_matrix: matrix } = outputs;
          const booleansValid = [run, required, diagnostic, enforce].every(value => value === 'true' || value === 'false');
          const modes = { skip: '[]', sample: '["hoi4_1939"]', strict: '["tno_1962","hoi4_1939"]' };
          let matrixValid = false;
          try { matrixValid = Object.hasOwn(modes, mode) && JSON.stringify(JSON.parse(matrix)) === modes[mode]; }
          catch { /* Missing or malformed classification fails closed. */ }
          const policyValid = booleansValid && matrixValid && (
            (mode === 'skip' && run === 'false' && required === 'false' && diagnostic === 'false' && enforce === 'false') ||
            (mode === 'sample' && run === 'true' && enforce === 'false' && required !== diagnostic) ||
            (mode === 'strict' && run === 'true' && required === 'true' && diagnostic === 'false')
          );
          const matrixResult = results['perf-scenarios']?.result;
          const passed = Object.keys(results).length === 2 && classification?.result === 'success' && policyValid && (
            (required === 'false' && matrixResult === 'skipped') ||
            (required === 'true' && matrixResult === 'success')
          );
          if (!passed) {
            console.error('A valid classification and its required measurement outcome are required.', results);
            process.exit(1);
          }
          console.log(required === 'false' ? 'Classifier explicitly exempted merge waiting.' : 'Required scenario measurements succeeded.');
          NODE
