name: Precision foundation validation
on:
  push:
    branches: ["codex/precision-foundation-p0-p4-20260923"]
    paths: [".github/workflows/precision-foundation-apply.yml"]
permissions:
  contents: write
concurrency:
  group: precision-foundation-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
      EVIDENCE: .runtime/reports/generated/precision-foundation-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Apply exact reviewed input
        id: apply
        run: |
          mkdir -p "$EVIDENCE" .runtime/tmp
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          parts = root / '.github/precision-foundation-transfer'
          encoded = ''.join((parts / f'part-{i}.b64').read_text().strip() for i in range(4))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '6bf7d1cfee3d3c85dd8318c60071c6ee57bd2c19358091e2ec2a7e50510814a7'
          payload = json.loads(lzma.decompress(compressed))
          patch = payload['patch'].encode()
          assert hashlib.sha256(patch).hexdigest() == payload['patch_sha256'] == 'b54eb5f0a4d75a292d444a2d9d18c08fa2abeabc2a824c63da1bc92f7c126ba5'
          for item in payload['changes']:
              name = item['path']
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              assert not name.startswith(('data/', 'dist/'))
              probe = subprocess.run(['git', 'rev-parse', '--verify', f'HEAD:{name}'], capture_output=True, text=True)
              actual = probe.stdout.strip() if probe.returncode == 0 else None
              assert actual == item['before'], (name, actual, item['before'])
          patch_file = root / '.runtime/tmp/precision-foundation.patch'
          patch_file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch_file)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch_file)], check=True)
          subprocess.run(['node', 'tools/build_test_import_graph.mjs'], check=True)
          for item in payload['changes']:
              raw = (root / item['path']).read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert blob == item['after'], (item['path'], blob, item['after'])
          evidence = Path(os.environ['EVIDENCE'])
          (evidence / 'changes.json').write_text(json.dumps(payload['changes'], indent=2) + '\n')
          (evidence / 'changed-files.txt').write_text('\n'.join(i['path'] for i in payload['changes']) + '\n')
          print('Verified exact before/after blobs for', len(payload['changes']), 'files')
          PY
      - name: Preserve verified source blobs without moving any ref
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          out = Path(os.environ['EVIDENCE'])
          changes = json.loads((out / 'changes.json').read_text())
          endpoint = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs'
          saved = []
          for item in changes:
              body = json.dumps({'content': base64.b64encode(Path(item['path']).read_bytes()).decode(), 'encoding': 'base64'}).encode()
              req = urllib.request.Request(endpoint, data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == item['after']
              saved.append({'path': item['path'], 'mode': '100644', 'type': 'blob', 'sha': result['sha']})
          (out / 'verified-tree-entries.json').write_text(json.dumps({'parent_sha': os.environ['GITHUB_SHA'], 'entries': saved}, indent=2) + '\n')
          print('Stored', len(saved), 'verified source blobs. No branch, main or deployment was changed.')
          PY
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -r requirements-dev.lock.txt
          npx playwright install --with-deps chromium
      - name: Focused Node behavior
        id: node
        continue-on-error: true
        run: |
          node --test tests/precision_foundation_patch_behavior.test.mjs tests/geometry_raster_runtime_owner_behavior.test.mjs tests/geometry_raster_worker_kernel_behavior.test.mjs tests/geometry_raster_worker_client_behavior.test.mjs tests/latency_bulk_worker_behavior.test.mjs tests/precision_foundation_ci_behavior.test.mjs tests/pr_ci_plan_behavior.test.mjs tests/startup_ready_handoff_behavior.test.mjs tests/precision_scaling_verification_records.test.mjs 2>&1 | tee "$EVIDENCE/node.tap"
      - name: Python contracts and real bundle fixtures
        id: python
        continue-on-error: true
        run: |
          python -m unittest tests.test_precision_foundation_build tests.test_e2e_structural_tooling tests.test_perf_gate_contract tests.test_pages_artifact_admission tests.test_us_county_adapted_bundle -q 2>&1 | tee "$EVIDENCE/python.log"
      - name: Native module worker pixel oracle
        id: native
        continue-on-error: true
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8000
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$EVIDENCE/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/ > /dev/null
          env -u CI node node_modules/@playwright/test/cli.js test tests/e2e/dev/precision_foundation_patch.dev.spec.js --workers=1 --retries=0 2>&1 | tee "$EVIDENCE/native.log"
      - name: Source-built Pages artifact contracts
        id: pages
        continue-on-error: true
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/pages-foundation/dist
        run: |
          python tools/build_pages_dist.py --output-root .runtime/pages-foundation/dist 2>&1 | tee "$EVIDENCE/pages-build.log"
          python -m unittest tests.test_pages_dist_startup_shell -q 2>&1 | tee "$EVIDENCE/pages-contracts.log"
      - name: Changed-file routing and whitespace
        id: routing
        continue-on-error: true
        run: |
          git diff --check
          node tools/select_verification_targets.mjs --changed-files-list "$EVIDENCE/changed-files.txt" --json-out "$EVIDENCE/selection.json" --md-out "$EVIDENCE/selection.md"
      - name: Record diagnostic outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$EVIDENCE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'steps': json.loads(os.environ['STEP_OUTCOMES']), 'production_published': False, 'candidate_performance_accepted': False}
          Path(os.environ['EVIDENCE'], 'outcomes.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: precision-foundation-hosted-evidence
          path: |
            .runtime/reports/generated/precision-foundation-hosted/
            .runtime/tests/playwright/
          retention-days: 5
          if-no-files-found: error
      - name: Require all validation outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json, os
          steps = json.loads(os.environ['STEP_OUTCOMES'])
          expected = ['apply', 'objects', 'node', 'python', 'native', 'pages', 'routing']
          failed = [key for key in expected if steps.get(key, {}).get('outcome') != 'success']
          if failed:
              raise SystemExit('Validation incomplete or failed: ' + ', '.join(failed))
          PY
