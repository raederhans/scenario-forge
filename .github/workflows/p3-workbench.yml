name: P3 audit workbench
on:
  push:
    branches: [codex/visual-editing-p3-20260925]
    paths: [.github/workflows/p3-workbench.yml]
permissions:
  contents: read
concurrency:
  group: p3-visual-workbench
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-editing-p3-20260925
          fetch-depth: 40
          sparse-checkout: |
            .github
            js
            tests
            tools
            docs/architecture
      - name: Apply reviewed fixes and retain merged capital corrections
        id: source
        run: |
          python .github/apply-p3-review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: reject partial developer fills and verify shared paint publication'
          fi
          git fetch origin aed67962d6f814c7a2d86e3e6d2fb43385704404 --depth=8
          git merge --no-edit --no-ff aed67962d6f814c7a2d86e3e6d2fb43385704404
          git push origin HEAD:codex/visual-editing-p3-20260925
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aed67962d6f814c7a2d86e3e6d2fb43385704404
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Independently recheck merged P1/P2 and record the historical proof limitation
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.runtime/reports/p3-baseline');root.mkdir(parents=True,exist_ok=True)
          (root/'source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          checks=[('p1p2-behavior',['npm','run','test:node:ownership-retirement']),('boundaries',['node','tools/check_architecture_boundaries.mjs']),('write-allowlist',['node','tools/check_state_write_allowlist.mjs'])]
          results=[]
          for name,cmd in checks:
            run=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            (root/f'{name}.log').write_text(run.stdout); print(run.stdout,flush=True)
            results.append({'check':name,'exit_code':run.returncode})
          proof=subprocess.run(['node','tools/check_state_writer_policy.mjs','--json'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          (root/'historical-proof.log').write_text(proof.stdout)
          (root/'checks.json').write_text(json.dumps({'checks':results,'historical_proof_exit_code':proof.returncode},indent=2))
          raise SystemExit(any(row['exit_code'] for row in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-baseline-evidence
          path: .runtime/reports/p3-baseline
          retention-days: 3
  behavior:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Behavior, complete reference data and integration boundaries
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.runtime/reports/p3-behavior');root.mkdir(parents=True,exist_ok=True)
          (root/'source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          checks=[
            ('node-p3',['npm','run','test:node:ownership-retirement']),
            ('scenario-lifecycle',['npm','run','test:node:scenario-lifecycle-runtime-behavior']),
            ('python-boundaries',['python','-m','unittest','tests.test_map_renderer_color_resolution_strategy_boundary_contract','tests.test_scenario_state_actions_boundary_contract','tests.test_sidebar_split_boundary_contract','tests.test_map_renderer_click_selection_transaction_boundary_contract','tests.test_history_manager_strategic_overlay_contract','-q']),
            ('architecture',['node','tools/check_architecture_boundaries.mjs']),
            ('state-write-allowlist',['node','tools/check_state_write_allowlist.mjs']),
            ('script-portfolio',['node','tools/verification/script_portfolio.mjs','check']),
            ('e2e-inventory',['node','tools/e2e_layering.mjs','check']),
            ('import-graph',['node','tools/check_test_import_graph.mjs']),
            ('route-schema',['node','tools/select_verification_targets.mjs','--check']),
            ('quick-fill-real-data',['node','tools/audit_quick_fill.mjs']),
            ('capital-regressions',['node','--test','tests/city_data_contract_behavior.test.mjs','tests/scenario_capitals_behavior.test.mjs','tests/urban_city_policy_strategic_values_behavior.test.mjs']),
          ]
          results=[]
          for name,cmd in checks:
            print(f'::group::{name}',flush=True)
            run=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            (root/f'{name}.log').write_text(run.stdout);print(run.stdout,flush=True)
            results.append({'check':name,'exit_code':run.returncode,'command':cmd})
            (root/'checks.json').write_text(json.dumps(results,indent=2))
            print('::endgroup::',flush=True)
          proof=subprocess.run(['node','tools/check_state_writer_policy.mjs','--json'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          (root/'historical-proof.log').write_text(proof.stdout)
          (root/'historical-proof-status.json').write_text(json.dumps({'exit_code':proof.returncode}))
          raise SystemExit(any(row['exit_code'] for row in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-behavior-evidence
          path: |
            .runtime/reports/p3-behavior
            .runtime/reports/generated/quick-fill-support.*
          retention-days: 3
  browser:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
          npx playwright install --with-deps chromium
      - name: Real-map transactions and editor UI regressions
        run: |
          mkdir -p .runtime/reports/p3-browser
          git rev-parse HEAD > .runtime/reports/p3-browser/source-sha.txt
          set -o pipefail
          npx playwright test tests/e2e/ownership_retirement.spec.js tests/e2e/ui_rework_mainline_shell_sidebar.spec.js --grep 'ownership editing|P3 real-map|desktop commands' --workers=1 2>&1 | tee .runtime/reports/p3-browser/playwright.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-browser-evidence
          path: |
            .runtime/reports/p3-browser
            .runtime/tests/playwright
          retention-days: 3
  publication:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
      - name: Verify built Pages artifact
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/p3/pages
        run: |
          mkdir -p .runtime/reports/p3-publication
          git rev-parse HEAD > .runtime/reports/p3-publication/source-sha.txt
          set -o pipefail
          python tools/build_pages_dist.py --output-root .runtime/p3/pages 2>&1 | tee .runtime/reports/p3-publication/build.log
          python -m unittest tests.test_pages_dist_startup_shell -q 2>&1 | tee .runtime/reports/p3-publication/startup-shell.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-publication-evidence
          path: .runtime/reports/p3-publication
          retention-days: 3
