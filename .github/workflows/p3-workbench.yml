name: P3 audit workbench
on:
  push:
    branches: [codex/visual-editing-p3-20260925]
    paths: [.github/workflows/p3-workbench.yml]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js
            tools
      - name: Compare complete reference membership with topology and coarse chunks
        run: |
          mkdir -p .runtime/reports/p3-coverage
          python - <<'PY'
          import subprocess,json,gzip,hashlib
          from pathlib import Path
          reports=[]
          def read(path):
              data=subprocess.check_output(['git','show',f'HEAD:{path}'])
              payload=json.loads(gzip.decompress(data) if path.endswith('.gz') else data)
              return payload,hashlib.sha256(data).hexdigest()
          def ids(data):
              rows=data.get('features') or data.get('objects',{}).get('political',{}).get('geometries',[]) or []
              return {str(row.get('properties',{}).get('id') or row.get('id') or '') for row in rows} - {''}
          for scenario in ['blank_base','modern_world','hoi4_1936','hoi4_1939','tno_1962']:
              manifest,_=read(f'data/scenarios/{scenario}/manifest.json')
              owners,owners_hash=read(manifest['owners_url'])
              reference=set(owners.get('owners',{}))
              report={'scenario':scenario,'reference_count':len(reference),'reference_sha256':owners_hash,'sources':[]}
              paths=[(key,manifest[key]) for key in ['runtime_bootstrap_topology_url','runtime_topology_url'] if manifest.get(key)]
              chunk_url=manifest.get('detail_chunk_manifest_url')
              if chunk_url:
                  chunks,_=read(chunk_url)
                  report['political_chunk_count']=sum(chunk.get('layer')=='political' for chunk in chunks.get('chunks',[]))
                  paths += [('global_coarse_chunk',chunk['url']) for chunk in chunks.get('chunks',[]) if chunk.get('layer')=='political' and chunk.get('lod')=='coarse' and chunk.get('global_coverage')]
              for kind,path in paths:
                  payload,digest=read(path)
                  feature_ids=ids(payload)
                  missing=sorted(reference-feature_ids)
                  report['sources'].append({'kind':kind,'path':path,'sha256':digest,'format':payload.get('type'),'feature_count':len(feature_ids),'missing_reference_count':len(missing),'missing_reference_examples':missing[:12]})
                  del payload
              reports.append(report)
          output={'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'kind':'membership_coverage_not_pixel_or_adjacency_proof','scenarios':reports}
          Path('.runtime/reports/p3-coverage/coverage.json').write_text(json.dumps(output,indent=2))
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-reference-topology-coverage
          path: .runtime/reports/p3-coverage
          retention-days: 3
