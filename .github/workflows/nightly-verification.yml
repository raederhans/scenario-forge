name: Nightly Verification

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Nightly Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check full-tree heavy test classification
        run: python tools/check_heavy_test_classification.py

      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run Nightly metadata contracts
        run: npm run verify:local-infra
      - name: Upload Nightly metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-metadata-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  p4-checker-boundaries:
    name: Nightly P4 Checker and Python Boundaries
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:WHEELHOUSE_DIR | Out-Null
          python -m pip download -r requirements-dev.lock.txt --dest $env:WHEELHOUSE_DIR
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$env:WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run checker producer and all Python P4 boundaries
        run: node tools/verification/p4_nightly_authority.mjs --role checker-boundaries --out .runtime/reports/generated/nightly/p4-checker-boundaries.json
      - name: Upload checker and boundary authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-p4-checker-boundaries-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/reports/generated/**
          if-no-files-found: error
          retention-days: 14

  p4-full-policy:
    name: Nightly P4 Canonical Full Policy TAP
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Windows Job V2 canonical full policy TAP
        run: node tools/verification/p4_nightly_authority.mjs --role full-policy-tap --out .runtime/reports/generated/nightly/p4-full-policy-tap.json
      - name: Upload canonical full policy authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-p4-full-policy-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/reports/generated/**
          if-no-files-found: error
          retention-days: 14

  p4-fast:
    name: Nightly P4.4 Fast Contracts and Routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run fast P4.4 contracts and routes
        run: node tools/verification/p4_nightly_authority.mjs --role fast-contracts-routes --out .runtime/reports/generated/nightly/p4-fast-contracts-routes.json
      - name: Upload fast contracts and routes authority
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-p4-fast-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/reports/generated/**
          if-no-files-found: error
          retention-days: 14

  p4-closeout:
    name: Nightly P4 Closeout
    needs: ["p4-checker-boundaries", "p4-full-policy", "p4-fast"]
    runs-on: ubuntu-latest
    outputs:
      evidence_id: ${{ steps.closeout.outputs.evidence_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Download checker and boundary authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-checker-boundaries-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/p4-authorities/checker
      - name: Download canonical full policy authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-full-policy-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/p4-authorities/full
      - name: Download fast contracts and routes authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-fast-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/p4-authorities/fast
      - name: Validate exact three-authority P4 closeout
        id: closeout
        run: |
          TREE_SHA=$(git rev-parse 'HEAD^{tree}')
          node tools/verification/p4_nightly_closeout.mjs \
            --authority .runtime/p4-authorities/checker/nightly/p4-checker-boundaries.json \
            --authority .runtime/p4-authorities/full/nightly/p4-full-policy-tap.json \
            --authority .runtime/p4-authorities/fast/nightly/p4-fast-contracts-routes.json \
            --expected-sha "${{ github.sha }}" \
            --expected-tree "$TREE_SHA" \
            --evidence .runtime/p4-authorities/checker/p4-state-actions/P4.4/state-writer-policy-evidence.json \
            --tap .runtime/p4-authorities/full/p4-state-actions/P4.0/state-writer-policy-tests.tap \
            --completed .runtime/p4-authorities/full/p4-state-actions/P4.0/state-writer-policy-tests.completed.json \
            --out .runtime/reports/generated/nightly/p4-closeout.json
          EVIDENCE_ID=$(node -p "require('./.runtime/reports/generated/nightly/p4-closeout.json').evidenceId")
          echo "evidence_id=$EVIDENCE_ID" >> "$GITHUB_OUTPUT"
      - name: Upload P4 closeout authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-p4-closeout-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/reports/generated/nightly/p4-closeout.json
          if-no-files-found: error
          retention-days: 14

  linux-core:
    name: Nightly Linux Core ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run balanced Linux core shard
        run: node tools/run_core_verification.mjs --nightly-linux-core --shard-index ${{ matrix.shard }} --shard-count 2 --json-out .runtime/reports/generated/nightly/linux-core-${{ matrix.shard }}.json --md-out .runtime/reports/generated/nightly/linux-core-${{ matrix.shard }}.md --profile-out .runtime/reports/generated/nightly/linux-core-${{ matrix.shard }}-profile.json
      - name: Upload Linux core shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-linux-core-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: Nightly Pages Dist and Drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run Pages dist and drift verification
        run: npm run verify:pages-dist-and-drift

  pages-artifact-shadow:
    name: Nightly Pages Artifact Shadow
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build artifact-only Pages shadow dist
        run: python tools/build_pages_dist.py --output-root .runtime/pages-artifact-shadow/dist
      - name: Build legacy tracked Pages reference
        run: python tools/build_pages_dist.py
      - name: Verify artifact-only Pages shadow
        run: python tools/pages_artifact_shadow.py verify --artifact-root .runtime/pages-artifact-shadow/dist --run-id github-${{ github.run_id }}-${{ github.run_attempt }} --comparison-out .runtime/reports/generated/nightly/pages-artifact-shadow-comparison.json
      - name: Start artifact-only Pages shadow server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory .runtime/pages-artifact-shadow/dist > /tmp/pages-artifact-shadow-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::artifact-only Pages shadow server did not become ready"
          exit 1
      - name: Smoke artifact-only Pages shadow
        env:
          SCENARIO_FORGE_PAGES_URL: http://127.0.0.1:4173/
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
        run: npm run test:e2e:pages-public-release-gate
      - name: Record artifact-only Pages shadow receipt
        run: python tools/pages_artifact_shadow.py receipt --comparison .runtime/reports/generated/nightly/pages-artifact-shadow-comparison.json --public-smoke passed --out .runtime/reports/generated/nightly/pages-artifact-shadow.json
      - name: Upload artifact-only Pages shadow
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-pages-artifact-shadow-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .runtime/pages-artifact-shadow/dist
            .runtime/reports/generated/nightly/pages-artifact-shadow-comparison.json
            .runtime/reports/generated/nightly/pages-artifact-shadow.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  browser:
    name: Nightly Browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Nightly browser shard
        run: npm run test:e2e:sample-guide
      - name: Upload Nightly browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-browser-${{ github.run_id }}
          path: |
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  scenario-heavy:
    name: Nightly Scenario Heavy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run strict scenario contracts
        run: npm run verify:scenario-contracts:strict
      - name: Run canonical Nightly scenario heavy routes
        run: node tools/run_core_verification.mjs --nightly-scenario-heavy --json-out .runtime/reports/generated/nightly/scenario-heavy.json --md-out .runtime/reports/generated/nightly/scenario-heavy.md --profile-out .runtime/reports/generated/nightly/scenario-heavy-profile.json
      - name: Upload scenario-heavy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-scenario-heavy-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  windows-governance:
    name: Nightly Windows Governance
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: scenario-forge-system-power-scheme
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Windows Job V2 verifies a frozen Williams baseline commit.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Williams governance contracts
        run: npm run test:node:williams-crossover-governance
      - name: Run Williams Job runner integration
        run: npm run test:node:williams-crossover-job-runner
      - name: Run Windows Job V2 contracts
        run: npm run test:node:windows-job-runtime
      - name: Run Windows Job V2 runtime integration
        run: npm run test:node:windows-job-runtime:integration
      - name: Run bounded power-scheme live preflight
        run: npm run perf:williams-power-scheme:live-preflight
      - name: Run bounded telemetry live lane
        run: npm run test:node:williams-crossover-telemetry-live
      - name: Upload Windows governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-windows-governance-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  final:
    name: Nightly Final Aggregator
    if: always()
    needs: ["metadata", "linux-core", "pages", "pages-artifact-shadow", "browser", "scenario-heavy", "p4-closeout", "windows-governance"]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Nightly shard results
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const expectedJobs = ["metadata", "linux-core", "pages", "pages-artifact-shadow", "browser", "scenario-heavy", "p4-closeout", "windows-governance"];
          const needs = JSON.parse(process.env.REQUIRED_RESULTS);
          const actualJobs = Object.keys(needs).sort();
          const expectedJobsSorted = [...expectedJobs].sort();
          const dependencySetMatches = JSON.stringify(actualJobs) === JSON.stringify(expectedJobsSorted);
          const rows = expectedJobs.map((job) => `| ${job} | ${needs[job]?.result ?? "missing"} |`);
          const summary = ["## Nightly shard results", "", "| Job | Result |", "| --- | --- |", ...rows, ""].join("\n");
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          const rejected = expectedJobs.filter((job) => needs[job]?.result !== "success");
          if (!dependencySetMatches || rejected.length > 0) {
            console.error(`Nightly verification failed: ${rejected.join(", ") || "dependency set mismatch"}`);
            process.exit(1);
          }
          NODE
