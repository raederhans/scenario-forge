name: All tests nightly

# Runs every unit test, including the slow lists and the quarantine in
# tests/quarantine.json, so known breakage stays visible. PRs run the same
# suites without those entries (pr-verify.yml, job pr-tests).
on:
  schedule:
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-tests:
    name: all-tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: ["node --all", "python --all"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
      - name: Run every test
        # -n auto on the 4-core runner ran out of memory on the slow TNO suites
        # (the runner was shut down around 60% every night); two workers fit.
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
          PYTEST_ADDOPTS: "-v"
        run: |
          (while true; do echo "[mon] $(free -m | awk '/Mem/{print "mem used="$3" avail="$7}') $(df -m / | awk 'NR==2{print "disk avail="$4}')"; sleep 15; done) &
          node tools/run_all_tests.mjs ${{ matrix.suite }}

  sample-guide-e2e:
    # PRs run only the @golden-demo slice of this spec (verify-shared.yml, pr-smoke).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the sample guide spec
        run: npm run test:e2e:sample-guide
