name: P3B integration closeout
on:
  push:
    branches: [codex/p3b-acceptance-20260925]
    paths: [.github/workflows/p3b-integration.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/paint-contours-p3b-20260925
          sparse-checkout: |
            tests
      - name: Apply exact reviewed test-only changes
        id: source
        run: |
          python - <<'PY'
          import base64,hashlib,zlib,re,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='a8b5a4447d1ab3b28d226015647ca106c907ad3a'
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a3ca356088be5ab6da26d0d70e01358f3154e5e10b6f0e9899ede6a3cf7935b2'
          entries=[]
          for block in patch.decode().split('diff --git ')[1:]:
            head,_,body=block.partition('\n');m=re.fullmatch(r'a/(tests/\S+) b/\1',head);assert m
            before,after=re.search(r'^index ([a-f0-9]{40})\.\.([a-f0-9]{40})',body,re.M).groups();entries.append((m[1],before,after))
          assert len(entries)==5
          blob=lambda path:subprocess.check_output(['git','hash-object',path],text=True).strip()
          for path,before,_ in entries:assert blob(path)==before,path
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          for path,_,after in entries:assert blob(path)==after,path
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={p for p,_,_ in entries}
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: reconcile contour routes and reference fixtures against the built Pages artifact'
          git push origin HEAD:codex/paint-contours-p3b-20260925
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  integration:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci && python -m pip install -r requirements-dev.lock.txt
      - name: Build exact source artifact and select all affected child contracts
        run: |
          mkdir -p .runtime/reports/p3b-integration-final
          git rev-parse HEAD > .runtime/reports/p3b-integration-final/source-sha.txt
          git fetch --no-tags --depth=1 origin 278886451ed93b383aaee6e6a715efbec69640b2
          git diff --name-only 278886451ed93b383aaee6e6a715efbec69640b2 HEAD > .runtime/reports/p3b-integration-final/changed-files.txt
          set -o pipefail
          python tools/build_pages_dist.py --output-root .runtime/p3b-integration-final/pages 2>&1 | tee .runtime/reports/p3b-integration-final/build.log
      - name: Execute every selected child contract and preserve full failure accounting
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/p3b-integration-final/pages
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {buildRepositoryRecommendation} from './tools/select_verification_targets.mjs';
          import {buildExecutionPlan,executeAdaptivePlan} from './tools/run_adaptive_tests.mjs';
          const root='.runtime/reports/p3b-integration-final';
          const files=fs.readFileSync(root+'/changed-files.txt','utf8').trim().split(/\r?\n/);
          const report=buildRepositoryRecommendation(files),plan=buildExecutionPlan(report);
          assert.deepEqual(report.unmatchedChangedFiles,[]);assert.deepEqual(plan.routeGaps,[]);
          assert.ok(plan.executionGroups.every(group=>group.executionOwner==='child-safe'&&group.resourceLocks.length===0));
          fs.writeFileSync(root+'/selection.json',JSON.stringify(report,null,2));fs.writeFileSync(root+'/plan.json',JSON.stringify(plan,null,2));
          let index=0;
          const results=executeAdaptivePlan(plan,{continueOnFailure:true,
            runner:(bin,args,options)=>{
              const id=String(++index).padStart(3,'0');console.log(`::group::${id} ${bin} ${args.join(' ')}`);
              const result=spawnSync(bin,args,{...options,stdio:'pipe',encoding:'utf8',maxBuffer:64*1024*1024});
              const output=(result.stdout||'')+'\n'+(result.stderr||'');fs.writeFileSync(root+'/'+id+'.log',output);console.log(output);console.log('::endgroup::');return result;
            },onCheckpoint:results=>fs.writeFileSync(root+'/results.json',JSON.stringify(results,null,2))});
          const failures=results.map((result,index)=>({...result,log:String(index+1).padStart(3,'0')+'.log'})).filter(result=>result.status!=='passed');
          fs.writeFileSync(root+'/summary.json',JSON.stringify({source:fs.readFileSync(root+'/source-sha.txt','utf8').trim(),commands:results.length,passed:results.length-failures.length,failures,deferredMainThread:plan.mainThreadCommands},null,2));
          process.exitCode=failures.length?1:0;
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3b-integration-final
          path: |
            .runtime/reports/p3b-integration-final/*.json
            .runtime/reports/p3b-integration-final/*.log
            .runtime/reports/p3b-integration-final/*.txt
          retention-days: 3
