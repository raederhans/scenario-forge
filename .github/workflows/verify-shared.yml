name: verify-shared

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile == 'pr-fast' && 20 || inputs.profile == 'pr-smoke' && 30 || 90 }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate verification profile
        shell: bash
        env:
          VERIFY_PROFILE: ${{ inputs.profile }}
        run: |
          case "$VERIFY_PROFILE" in
            pr-fast|pr-smoke|deploy-minimal) ;;
            *) echo "::error::unknown verification profile: $VERIFY_PROFILE"; exit 2 ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # deploy-minimal is stdlib-only; do not restore/save the shared pip cache.
          cache: ${{ inputs.profile != 'deploy-minimal' && 'pip' || '' }}
          cache-dependency-path: requirements-dev.lock.txt

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python test dependencies
        if: inputs.profile != 'deploy-minimal'
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Check deploy-minimal dependency guardrails
        if: inputs.profile == 'deploy-minimal'
        run: python tools/check_min_ci_requirements.py

      - name: Install Node dependencies
        run: npm ci

      - name: Validate public sample projects before Pages build
        if: inputs.profile == 'deploy-minimal' || inputs.profile == 'pr-fast'
        run: node --test tests/sample_project_contracts.test.mjs

      - name: Check Quick Fill hierarchy data and audit
        if: inputs.profile == 'pr-fast'
        run: |
          python tools/build_quick_fill_hierarchy.py --check
          node tools/audit_quick_fill.mjs

      - name: Check cataloged data health
        if: inputs.profile == 'pr-fast'
        # The full catalog contract test is on the nightly slow list; this direct run takes ~15 s.
        run: python tools/data_health.py

      - name: Check Pages source references
        if: inputs.profile == 'pr-fast'
        run: python tools/check_pages_source_graph.py

      - name: Build and check the Pages artifact
        if: inputs.profile == 'pr-fast'
        shell: bash
        run: |
          artifact_root=.runtime/pages-pr/dist
          python tools/build_pages_dist.py --output-root "$artifact_root"
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT="$artifact_root" python -m unittest tests.test_pages_dist_startup_shell -q

      - name: Cache Playwright browsers
        if: inputs.profile == 'pr-smoke'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: inputs.profile == 'pr-smoke'
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          max_retries=2
          attempt=0
          until npx playwright install chromium; do
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "playwright install chromium failed after $((attempt + 1)) attempts"
              exit 1
            fi
            sleep_seconds=$((2 ** attempt))
            echo "playwright install chromium failed on attempt $((attempt + 1)); retry in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Build Pages artifact from source
        if: inputs.profile == 'deploy-minimal'
        run: python tools/build_pages_dist.py --output-root .runtime/pages-release/dist

      - name: Check the Pages artifact startup shell
        if: inputs.profile == 'deploy-minimal'
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/pages-release/dist
        # The browser gates run against the uploaded artifact in parallel jobs
        # (deploy.yml release-checks); the admission job writes the receipt after them.
        run: python -m unittest tests.test_pages_dist_startup_shell -q

      - name: Run smoke E2E
        if: inputs.profile == 'pr-smoke'
        run: npm run test:e2e:smoke

      - name: Run Golden Demo E2E
        if: inputs.profile == 'pr-smoke'
        env:
          # The preceding smoke server can leave its non-reusable socket in TIME_WAIT.
          MAPCREATOR_DEV_PORT: '8811'
        run: npm run verify:demo

      - name: Run Quick Fill live toolbar smoke
        if: inputs.profile == 'pr-smoke'
        env:
          # Ports 8810/8811 may still be in TIME_WAIT from the smoke and demo servers.
          MAPCREATOR_DEV_PORT: '8812'
        run: |
          python tools/dev_server.py --port "$MAPCREATOR_DEV_PORT" > .runtime/quick-fill-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:$MAPCREATOR_DEV_PORT/app/" > /dev/null; then break; fi
            sleep 1
          done
          node tools/check_quick_fill_browser.mjs

      - name: Upload E2E failure context
        if: failure() && inputs.profile == 'pr-smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-context
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/quick-fill-server.log
            .runtime/browser/quick-fill/
            .runtime/tests/playwright/**/failure-context.json
            .runtime/tests/playwright/**/*-failure-context.json
            .runtime/tests/playwright/**/error-context.md
            .runtime/tests/playwright/**/test-failed-*.png
            .runtime/tests/playwright/**/trace.zip

      - name: Upload deploy dist artifact
        if: inputs.profile == 'deploy-minimal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-dist
          path: .runtime/pages-release/dist
          # Keep .nojekyll in the handoff artifact; upload-artifact omits hidden files by default.
          include-hidden-files: true
