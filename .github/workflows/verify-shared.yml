name: verify-shared

on:
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: full
      run-e2e-smoke:
        required: false
        type: boolean
        default: true
      pages-artifact-only:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # pr-fast falls back to HEAD^ outside pull_request events.
          fetch-depth: 2

      - name: Validate verification profile
        shell: bash
        env:
          VERIFY_PROFILE: ${{ inputs.profile }}
        run: |
          case "$VERIFY_PROFILE" in
            full|pr-fast|pr-smoke|demo|deploy-minimal) ;;
            *) echo "::error::unknown verification profile: $VERIFY_PROFILE"; exit 2 ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node
        if: inputs.profile == 'full' || inputs.profile == 'pr-fast' || inputs.profile == 'pr-smoke' || inputs.profile == 'demo' || inputs.profile == 'deploy-minimal'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          if [ "${{ inputs.profile }}" = "deploy-minimal" ]; then
            python -m pip download -r requirements-ci-min.lock.txt --dest "$WHEELHOUSE_DIR"
          else
            python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
          fi

      - name: Install Python test dependencies
        run: |
          if [ "${{ inputs.profile }}" = "deploy-minimal" ]; then
            python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-ci-min.lock.txt
          else
            python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
          fi

      - name: Check deploy-minimal dependency guardrails
        if: inputs.profile == 'deploy-minimal'
        run: python tools/check_min_ci_requirements.py

      - name: Install Node dependencies
        if: inputs.profile == 'full' || inputs.profile == 'pr-fast' || inputs.profile == 'pr-smoke' || inputs.profile == 'demo' || inputs.profile == 'deploy-minimal'
        run: npm ci

      - name: Explain verification selector
        id: selector
        if: inputs.profile == 'pr-fast'
        shell: bash
        run: |
          mkdir -p .runtime/tmp .runtime/reports/generated
          changed_files=.runtime/tmp/verification-selector-changed-files.txt
          : > "$changed_files"
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > "$changed_files"
          else
            git diff --name-only HEAD^ HEAD > "$changed_files"
          fi
          test -s "$changed_files" || { echo "::error::verification selector received an empty changed-file set"; exit 1; }
          node tools/select_verification_targets.mjs --changed-files-list "$changed_files" --json-out .runtime/reports/generated/verification-selector-explain.json --md-out .runtime/reports/generated/verification-selector-explain.md

      - name: Check tracked Pages mirrors for relevant PR changes
        if: inputs.profile == 'pr-fast'
        shell: bash
        run: |
          changed_files=.runtime/tmp/verification-selector-changed-files.txt
          if grep -Eq '^(js/|css/|vendor/|landing/|data/|dist/|index\.html$|app\.js$|styles\.css$|tools/(build_pages_dist|pages_|app_entry_resolver)|\.github/workflows/verify-shared\.yml$)' "$changed_files"; then
            python tools/build_pages_dist.py
            git diff --exit-code -- dist/.nojekyll dist/app.js dist/index.html dist/styles.css dist/assets dist/app/index.html dist/app/js dist/app/css dist/app/vendor dist/pages-dist-manifest.json \
              || { echo "::error::tracked dist must match this PR's final source; run the canonical Pages builder and commit its output."; exit 1; }
          else
            echo "No Pages source, builder or mirror changes; mirror rebuild is not required."
          fi

      - name: Cache Playwright browsers
        if: (inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke' || inputs.profile == 'demo'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: (inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke' || inputs.profile == 'demo' || (inputs.profile == 'deploy-minimal' && inputs.pages-artifact-only)
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          max_retries=2
          attempt=0
          until npx playwright install chromium; do
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "playwright install chromium failed after $((attempt + 1)) attempts"
              exit 1
            fi
            sleep_seconds=$((2 ** attempt))
            echo "playwright install chromium failed on attempt $((attempt + 1)); retry in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Build Pages dist
        if: inputs.profile == 'deploy-minimal' && !inputs.pages-artifact-only
        run: python tools/build_pages_dist.py

      - name: Build Pages artifact from source
        if: inputs.profile == 'deploy-minimal' && inputs.pages-artifact-only
        run: python tools/build_pages_dist.py --output-root .runtime/pages-release/dist

      - name: Fail if tracked dist drifted from source
        if: inputs.profile == 'deploy-minimal' && !inputs.pages-artifact-only
        run: |
          git diff --exit-code -- dist/.nojekyll dist/app.js dist/index.html dist/styles.css dist/assets dist/app/index.html dist/app/js dist/app/css dist/app/vendor dist/pages-dist-manifest.json \
            || { echo "::error::dist/app is out of sync with source. Run 'python tools/build_pages_dist.py' and commit the result."; exit 1; }

      - name: Verify Pages dist startup shell
        if: inputs.profile == 'deploy-minimal' && !inputs.pages-artifact-only
        run: python -m unittest tests.test_pages_dist_startup_shell -q

      - name: Verify and exercise the Pages artifact
        if: inputs.profile == 'deploy-minimal' && inputs.pages-artifact-only
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/pages-release/dist
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
        run: |
          python -m unittest tests.test_pages_dist_startup_shell -q
          python -m http.server 4173 --bind 127.0.0.1 --directory .runtime/pages-release/dist > .runtime/pages-release/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run test:e2e:pages-public-release-gate
          node node_modules/@playwright/test/cli.js test tests/e2e/project_save_load_roundtrip.spec.js --grep 'editing baseline fast hoi4_1936.*roundtrip only' --workers=1 --retries=0
          python tools/pages_artifact_admission.py --artifact-root .runtime/pages-release/dist --run-id github-${{ github.run_id }}-${{ github.run_attempt }} --public-smoke passed --receipt-out .runtime/pages-release/receipt.json --summary-out .runtime/pages-release/summary.json

      - name: Upload Pages artifact admission
        if: inputs.profile == 'deploy-minimal' && inputs.pages-artifact-only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-admission
          path: .runtime/pages-release/receipt.json
          if-no-files-found: error

      - name: Run Python unit tests
        if: inputs.profile == 'full'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run affected child-safe contracts
        if: always() && inputs.profile == 'pr-fast' && steps.selector.outcome != 'skipped'
        run: |
          node tools/run_adaptive_tests.mjs \
            --changed-files-list .runtime/tmp/verification-selector-changed-files.txt \
            --selection-json .runtime/reports/generated/verification-selector-explain.json \
            --execute \
            --defer-main-thread \
            --profile-out .runtime/reports/generated/verification-selector-execution.profile.json \
            --json-out .runtime/reports/generated/verification-selector-execution.json \
            --md-out .runtime/reports/generated/verification-selector-execution.md

      - name: Upload verification selector evidence
        if: always() && inputs.profile == 'pr-fast'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-selector-evidence
          if-no-files-found: ignore
          path: |
            .runtime/reports/generated/verification-selector-explain.*
            .runtime/reports/generated/verification-selector-execution.*
            .runtime/reports/generated/test-import-graph.json
            .runtime/reports/generated/test-timeout-inventory.*
            .runtime/reports/generated/test-import-graph-summary.*
            .runtime/tmp/verification-selector-changed-files.txt
            tests/e2e/test-import-graph.json

      - name: Run renderer split node behavior tests
        if: inputs.profile == 'full'
        run: npm run test:node:renderer-splits

      - name: Run scenario chunk static contracts
        if: inputs.profile == 'full'
        run: npm run test:node:scenario-chunk-contracts

      - name: Run physical layer static contracts
        if: inputs.profile == 'full'
        run: npm run test:node:physical-layer-contracts

      - name: Verify E2E layer manifest
        if: inputs.profile == 'pr-fast'
        run: npm run verify:test:e2e-layers

      - name: Verify test infra guardrails
        if: inputs.profile == 'pr-fast'
        run: |
          npm run verify:test-console-allowlist
          npm run verify:test-timeout-guardrails

      - name: Run test infra structural contracts
        if: inputs.profile == 'pr-fast'
        run: python -m unittest tests.test_e2e_structural_tooling -q

      - name: Run strict TNO scenario contract gate
        if: inputs.profile == 'full' || inputs.profile == 'pr-fast'
        run: python tools/check_scenario_contracts.py --strict --scenario-dir data/scenarios/tno_1962 --report-path .runtime/reports/generated/tno_1962.strict_contract_report.json

      - name: Run smoke E2E
        if: (inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke'
        run: npm run test:e2e:smoke

      - name: Write smoke timing summary
        if: always() && ((inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke')
        run: npm run verify:test-timing-summary

      - name: Upload smoke timing and failure-context artifacts
        if: always() && ((inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-timing-and-failure-context
          if-no-files-found: ignore
          path: |
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/test-timings-summary.json
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/**/failure-context.json

      - name: Run Golden Demo E2E
        if: inputs.profile == 'demo'
        run: npm run verify:demo

      - name: Write Demo timing summary
        if: always() && inputs.profile == 'demo'
        run: npm run verify:test-timing-summary

      - name: Upload Demo timing and failure-context artifacts
        if: always() && inputs.profile == 'demo'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-timing-and-failure-context
          if-no-files-found: ignore
          path: |
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/test-timings-summary.json
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/**/failure-context.json

      - name: Upload deploy dist artifact
        if: inputs.profile == 'deploy-minimal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-dist
          path: ${{ inputs.pages-artifact-only && '.runtime/pages-release/dist' || 'dist' }}
          # Keep .nojekyll in the handoff artifact; upload-artifact omits hidden files by default.
          include-hidden-files: true
