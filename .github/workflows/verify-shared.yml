name: verify-shared

on:
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: full
      run-e2e-smoke:
        required: false
        type: boolean
        default: true
      run-golden-demo:
        required: false
        type: boolean
        default: false
      pages-artifact-only:
        description: Deprecated compatibility input; both values build and verify a source artifact.
        required: false
        type: boolean
        default: true
      run-pages-check:
        required: false
        type: boolean
        default: true
      run-pages-source-check:
        required: false
        type: boolean
        default: false
      smoke-mode:
        required: false
        type: string
        default: full

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.profile == 'pr-fast' || inputs.profile == 'pr-smoke' || inputs.profile == 'demo') && 15 || 90 }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # pr-fast falls back to HEAD^ outside pull_request events.
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            ${{ inputs.profile != 'full' && '!/dist/' || '' }}

      - name: Validate verification profile
        shell: bash
        env:
          VERIFY_PROFILE: ${{ inputs.profile }}
          SMOKE_MODE: ${{ inputs.smoke-mode }}
        run: |
          case "$VERIFY_PROFILE" in
            full|pr-fast|pr-smoke|demo|deploy-minimal) ;;
            *) echo "::error::unknown verification profile: $VERIFY_PROFILE"; exit 2 ;;
          esac
          case "$SMOKE_MODE" in
            full|ui) ;;
            *) echo "::error::unknown smoke mode: $SMOKE_MODE"; exit 2 ;;
          esac
          if [ "$SMOKE_MODE" = "ui" ] && [ "$VERIFY_PROFILE" != "pr-smoke" ]; then
            echo "::error::focused UI smoke requires the pr-smoke profile"
            exit 2
          fi
          if [ "${{ inputs.run-pages-source-check }}" = "true" ] && { [ "$VERIFY_PROFILE" != "pr-fast" ] || [ "${{ inputs.run-pages-check }}" = "true" ]; }; then
            echo "::error::source Pages checks require pr-fast without a full Pages build"
            exit 2
          fi
          if [ "${{ inputs.run-golden-demo }}" = "true" ] && [ "$VERIFY_PROFILE" != "pr-smoke" ]; then
            echo "::error::run-golden-demo requires the pr-smoke profile"
            exit 2
          fi

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # deploy-minimal is stdlib-only; do not restore/save the shared pip cache.
          cache: ${{ inputs.profile != 'deploy-minimal' && 'pip' || '' }}
          cache-dependency-path: requirements-dev.lock.txt

      - name: Setup Node
        if: inputs.profile == 'full' || inputs.profile == 'pr-fast' || inputs.profile == 'pr-smoke' || inputs.profile == 'demo' || inputs.profile == 'deploy-minimal'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python test dependencies
        if: inputs.profile != 'deploy-minimal'
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Check deploy-minimal dependency guardrails
        if: inputs.profile == 'deploy-minimal'
        run: python tools/check_min_ci_requirements.py

      - name: Install Node dependencies
        if: inputs.profile == 'full' || inputs.profile == 'pr-fast' || inputs.profile == 'pr-smoke' || inputs.profile == 'demo' || inputs.profile == 'deploy-minimal'
        run: npm ci

      - name: Validate public sample projects before Pages build
        if: inputs.profile == 'deploy-minimal' || (inputs.profile == 'pr-fast' && inputs.run-pages-check)
        run: node --test tests/sample_project_contracts.test.mjs

      - name: Read affected files
        id: selector
        if: inputs.profile == 'pr-fast' || inputs.profile == 'pr-smoke'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/tmp
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --no-renames "$BASE_SHA" HEAD > .runtime/tmp/pr-check-files.txt
          else
            git diff --name-only --no-renames HEAD^ HEAD > .runtime/tmp/pr-check-files.txt
          fi
          test -s .runtime/tmp/pr-check-files.txt

      - name: Check Pages source references without building artifacts
        if: inputs.profile == 'pr-fast' && inputs.run-pages-source-check
        run: python tools/check_pages_source_graph.py

      - name: Build and check Pages artifact for relevant PR changes
        if: inputs.profile == 'pr-fast' && inputs.run-pages-check
        shell: bash
        run: |
          artifact_root=.runtime/pages-pr/dist
          python tools/build_pages_dist.py --output-root "$artifact_root"
          echo "SCENARIO_FORGE_PAGES_ARTIFACT_ROOT=$artifact_root" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        if: (inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke' || inputs.profile == 'demo'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: (inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke' || inputs.profile == 'demo' || inputs.profile == 'deploy-minimal'
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          max_retries=2
          attempt=0
          until npx playwright install chromium; do
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "playwright install chromium failed after $((attempt + 1)) attempts"
              exit 1
            fi
            sleep_seconds=$((2 ** attempt))
            echo "playwright install chromium failed on attempt $((attempt + 1)); retry in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Build Pages artifact from source
        if: inputs.profile == 'deploy-minimal'
        run: python tools/build_pages_dist.py --output-root .runtime/pages-release/dist

      - name: Verify and exercise the Pages artifact
        id: pages_checks
        if: inputs.profile == 'deploy-minimal'
        env:
          SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/pages-release/dist
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory .runtime/pages-release/dist > .runtime/pages-release/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          npm run test:e2e:pages-public-release-gate
          node node_modules/@playwright/test/cli.js test tests/e2e/project_save_load_roundtrip.spec.js --grep 'editing baseline fast hoi4_1936.*roundtrip only' --workers=1 --retries=0
          python tools/pages_artifact_admission.py --artifact-root .runtime/pages-release/dist --run-id github-${{ github.run_id }}-${{ github.run_attempt }} --public-smoke passed --receipt-out .runtime/pages-release/receipt.json --summary-out .runtime/pages-release/summary.json

      - name: Upload Pages artifact failure evidence
        if: failure() && steps.pages_checks.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-artifact-failure-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .runtime/pages-release/server.log
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/

      - name: Upload Pages artifact admission
        if: inputs.profile == 'deploy-minimal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-admission
          path: .runtime/pages-release/receipt.json
          if-no-files-found: error

      - name: Run Python unit tests
        if: inputs.profile == 'full'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run core and affected behaviors
        if: inputs.profile == 'pr-fast'
        run: node tools/ci/run_pr_checks.mjs --changed-files-list .runtime/tmp/pr-check-files.txt --base "${{ github.event.pull_request.base.sha || 'HEAD^' }}" --lane unit

      - name: Run renderer split node behavior tests
        if: inputs.profile == 'full'
        run: npm run test:node:renderer-splits

      - name: Run scenario chunk static contracts
        if: inputs.profile == 'full'
        run: npm run test:node:scenario-chunk-contracts

      - name: Run physical layer static contracts
        if: inputs.profile == 'full'
        run: npm run test:node:physical-layer-contracts

      - name: Run strict TNO scenario contract gate
        # PR scenario contracts are owned by Scenario Contract Matrix.
        if: inputs.profile == 'full'
        run: python tools/check_scenario_contracts.py --strict --scenario-dir data/scenarios/tno_1962 --report-path .runtime/reports/generated/tno_1962.strict_contract_report.json

      - name: Run smoke E2E
        if: ((inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke') && inputs.smoke-mode == 'full'
        run: npm run test:e2e:smoke

      - name: Run focused UI E2E
        if: inputs.profile == 'pr-smoke' && inputs.smoke-mode == 'ui'
        run: node node_modules/@playwright/test/cli.js test tests/e2e/main_shell_i18n.spec.js tests/e2e/editor_detail_polish.spec.js --workers=1 --retries=0

      - name: Run affected browser behaviors
        if: inputs.profile == 'pr-smoke'
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.run-golden-demo }}" = "true" ]; then
            args+=(--changed-file tests/e2e/sample_guide_deeplink.spec.js)
          fi
          node tools/ci/run_pr_checks.mjs --changed-files-list .runtime/tmp/pr-check-files.txt --base "${{ github.event.pull_request.base.sha || 'HEAD^' }}" --lane browser "${args[@]}"

      - name: Write smoke timing summary
        if: always() && ((inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke')
        run: npm run verify:test-timing-summary

      - name: Upload smoke timing and failure-context artifacts
        if: always() && ((inputs.profile == 'full' && inputs.run-e2e-smoke) || inputs.profile == 'pr-smoke')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-timing-and-failure-context
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/test-timings-summary.json
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/**/failure-context.json
            .runtime/tests/playwright/**/*-failure-context.json
            .runtime/tests/playwright/**/error-context.md
            .runtime/tests/playwright/**/test-failed-*.png
            .runtime/tests/playwright/**/trace.zip
            .runtime/tests/playwright/**/native-gpu-readback-diagnostics*.json
            .runtime/reports/generated/native-gpu-readback-diagnostics/*.json

      - name: Run Golden Demo E2E
        if: inputs.profile == 'demo'
        env:
          # The preceding smoke server can leave its non-reusable socket in TIME_WAIT.
          MAPCREATOR_DEV_PORT: '8811'
        run: npm run verify:demo

      - name: Write Demo timing summary
        if: always() && (inputs.profile == 'demo' || inputs.run-golden-demo)
        run: npm run verify:test-timing-summary

      - name: Upload Demo timing and failure-context artifacts
        if: always() && (inputs.profile == 'demo' || inputs.run-golden-demo)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-timing-and-failure-context
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/test-timings-summary.json
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/**/failure-context.json
            .runtime/tests/playwright/**/*-failure-context.json
            .runtime/tests/playwright/**/error-context.md
            .runtime/tests/playwright/**/test-failed-*.png
            .runtime/tests/playwright/**/trace.zip
            .runtime/tests/playwright/**/native-gpu-readback-diagnostics*.json
            .runtime/reports/generated/native-gpu-readback-diagnostics/*.json

      - name: Upload deploy dist artifact
        if: inputs.profile == 'deploy-minimal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-dist
          path: .runtime/pages-release/dist
          # Keep .nojekyll in the handoff artifact; upload-artifact omits hidden files by default.
          include-hidden-files: true
