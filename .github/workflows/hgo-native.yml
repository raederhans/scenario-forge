name: HGO native app

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'apps/hgo/**'
      - '.github/workflows/hgo-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/hgo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/hgo/requirements.txt
      - name: Install data test dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthetic data and package tests
        run: npm run test:python
      - name: Engine and UI behavior tests
        run: npm test
      - name: Validate committed native data
        run: npm run validate:data
      - name: Source boundary
        run: npm run check
      - name: Standalone package
        run: python -B tools/build_app.py --output ../../.runtime/dist/hgo
      - name: Packaged boundary
        run: node tools/check_boundary.mjs ../../.runtime/dist/hgo
