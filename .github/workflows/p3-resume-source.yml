name: P3 continuation source snapshot
on:
  push:
    branches: [codex/visual-editing-p3-20260925]
    paths: [.github/workflows/p3-resume-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            js
            tests
            tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Package lockfile-matched parser distributions
        run: |
          mkdir -p .runtime/tmp
          tar -czf .runtime/tmp/parser-deps.tgz node_modules/acorn node_modules/acorn-walk
      - uses: actions/upload-artifact@v4
        with:
          name: p3-parser-dependencies
          path: .runtime/tmp/parser-deps.tgz
          retention-days: 2
