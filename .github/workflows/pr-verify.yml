name: pr-verify

on:
  pull_request:

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-verify-fast:
    uses: ./.github/workflows/verify-shared.yml
    with:
      profile: pr-fast
      run-e2e-smoke: false

  pr-verify-smoke:
    uses: ./.github/workflows/verify-shared.yml
    with:
      profile: pr-smoke
      run-e2e-smoke: true
      run-golden-demo: true

  pr-verify-required:
    name: PR Verify Required
    if: always()
    needs: ["pr-verify-fast", "pr-verify-smoke"]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful PR verification results
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const expectedJobs = ["pr-verify-fast", "pr-verify-smoke"];
          const allowedResults = new Set(["success"]);
          const needs = JSON.parse(process.env.REQUIRED_RESULTS);
          const actualJobs = Object.keys(needs).sort();
          const expectedJobsSorted = [...expectedJobs].sort();
          const dependencySetMatches = JSON.stringify(actualJobs) === JSON.stringify(expectedJobsSorted);
          const rejected = expectedJobs.filter((job) => !allowedResults.has(needs[job]?.result));

          for (const job of expectedJobs) {
            console.log(`${job}: ${needs[job]?.result ?? "missing"}`);
          }
          if (!dependencySetMatches || rejected.length > 0) {
            console.error(`Required PR verification failed: ${rejected.join(", ") || "dependency set mismatch"}`);
            process.exit(1);
          }
          NODE
