name: pr-verify

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on every PR. Jobs are kept few on purpose: each one pays about
# two minutes to check out this repository before doing any work.
jobs:
  checks:
    # One checkout, one Pages build, then every source check and the whole unit suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/pages-pr/dist
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
      - name: Build the Pages artifact
        run: python tools/build_pages_dist.py --output-root "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT"
      - name: Check the Pages artifact startup shell
        run: python -m unittest tests.test_pages_dist_startup_shell -q
      - name: Check data health and source references
        run: |
          python tools/build_quick_fill_hierarchy.py --check
          node tools/audit_quick_fill.mjs
          python tools/data_health.py
          python tools/check_pages_source_graph.py
      - name: Run the Node suite (tests/quarantine.json lists the only exclusions)
        run: node tools/run_all_tests.mjs node
      - name: Run the Python suite
        run: node tools/run_all_tests.mjs python

  golden:
    # Golden user flows (tests/e2e/golden): the behavior safety net. Each editor flow
    # cold-starts the app, so they are spread over two runners with two workers each.
    name: golden (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run golden flows
        run: node node_modules/@playwright/test/cli.js test tests/e2e/golden --fully-parallel --shard="${{ matrix.shard }}" --workers=2
      - name: Upload golden failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failure-${{ strategy.job-index }}
          if-no-files-found: ignore
          retention-days: 3
          path: .runtime/tests/playwright/

  pr-verify-required:
    name: PR Verify Required
    if: always()
    needs: ["checks", "golden"]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every PR verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          let ok = true;
          for (const [job, { result }] of Object.entries(needs)) {
            console.log(`${job}: ${result}`);
            if (result !== "success") ok = false;
          }
          if (!ok) process.exit(1);
          NODE
