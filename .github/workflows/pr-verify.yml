name: pr-verify

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on every PR. There is no path-based planner: the whole unit
# suite takes a few minutes, and a skipped lane is a lane nobody trusts.
jobs:
  pr-verify-fast:
    uses: ./.github/workflows/verify-shared.yml
    with:
      profile: pr-fast

  pr-tests:
    name: pr-tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ["node --shard=1/2", "node --shard=2/2", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
      - name: Run the whole suite (tests/quarantine.json lists the only exclusions)
        run: node tools/run_all_tests.mjs ${{ matrix.suite }}

  pr-golden:
    # Golden user flows (tests/e2e/golden): the behavior safety net for the rewrite.
    name: pr-golden (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run golden flows
        run: node node_modules/@playwright/test/cli.js test tests/e2e/golden --shard=${{ matrix.shard }} --workers=1
      - name: Upload golden failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-failure-${{ strategy.job-index }}
          if-no-files-found: ignore
          retention-days: 7
          path: .runtime/tests/playwright/

  pr-verify-smoke:
    uses: ./.github/workflows/verify-shared.yml
    with:
      profile: pr-smoke

  pr-verify-hgo:
    uses: ./.github/workflows/hgo-native.yml

  pr-verify-required:
    name: PR Verify Required
    if: always()
    needs: ["pr-verify-fast", "pr-tests", "pr-golden", "pr-verify-smoke", "pr-verify-hgo"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every PR verification job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          let ok = true;
          for (const [job, { result }] of Object.entries(needs)) {
            console.log(`${job}: ${result}`);
            if (result !== "success") ok = false;
          }
          if (!ok) process.exit(1);
          NODE
