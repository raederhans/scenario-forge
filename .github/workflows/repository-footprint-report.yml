name: Repository Footprint Report

on:
  workflow_dispatch:
    inputs:
      base:
        description: Optional Git revision to compare with the checked-out target
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  report-only:
    name: Report-only repository footprint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate report-only footprint baseline
        shell: bash
        env:
          DISPATCH_BASE: ${{ github.event.inputs.base || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          args=(--as-of "$(date -u +%F)")
          if [ -n "$DISPATCH_BASE" ]; then
            args+=(--base "$DISPATCH_BASE")
          elif [ -n "$PR_BASE_SHA" ]; then
            args+=(--base "$PR_BASE_SHA")
          fi
          node tools/repository_footprint.mjs "${args[@]}"
          cat .runtime/reports/generated/repository-footprint.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repository footprint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-footprint-${{ github.run_id }}
          path: .runtime/reports/generated/repository-footprint.*
          if-no-files-found: warn
          retention-days: 30
