name: Ownership boundary UI review
on:
  push:
    branches: [codex/visual-editing-boundary-p1-p2-20260924]
    paths: [.github/workflows/ownership-boundary-ui-review.yml]
permissions:
  contents: read
concurrency:
  group: ownership-boundary-ui-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            js
            tests
            tools
            css
            vendor
            backend
            map_backend
            map_builder
            scenario_builder
            ops
            landing
      - name: Load exact assets requested by the UI shell regression
        run: |
          mkdir -p .runtime/reports/ownership-ui-review
          git rev-parse HEAD > .runtime/reports/ownership-ui-review/source-sha.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files = ['CATALOG.json','city_lights/historical_1930_entries.json','country_feature_policies.json','geo_aliases.json','locales.json','runtime_asset_registry.json','scenarios/index.json','thematic_layers/index.json','thematic_layers/political/state_capacity_demo/manifest.json','thematic_layers/political/wgi_state_capacity_v1/manifest.json','thematic_layers/population/population_density_demo/manifest.json','thematic_layers/social/human_development_demo/manifest.json','transport_layers/japan_road/manifest.json']
          for name in files:
              path = Path('data') / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(subprocess.check_output(['git','show',f'HEAD:{path.as_posix()}']))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
          npx playwright install --with-deps chromium
      - name: Recheck behavior, policy and developer category UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, json
          root = Path('.runtime/reports/ownership-ui-review')
          commands = [
            ('node-retirement',['npm','run','test:node:ownership-retirement']),
            ('python-boundaries',['python','-m','unittest','tests.test_map_renderer_color_resolution_strategy_boundary_contract','tests.test_scenario_state_actions_boundary_contract','tests.test_sidebar_split_boundary_contract','-q']),
            ('state-write-boundary',['node','tools/check_state_write_allowlist.mjs']),
            ('script-portfolio',['node','tools/verification/script_portfolio.mjs','check']),
            ('browser-retirement',['npx','playwright','test','tests/e2e/ownership_retirement.spec.js','tests/e2e/ui_rework_mainline_shell_sidebar.spec.js','--grep','ownership editing|desktop commands','--workers=1']),
          ]
          results=[]
          for name, command in commands:
              print(f'::group::{name}',flush=True)
              run=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (root/f'{name}.log').write_text(run.stdout)
              print(run.stdout,flush=True)
              results.append({'check':name,'exit_code':run.returncode})
              (root/'checks.json').write_text(json.dumps(results,indent=2))
              print('::endgroup::',flush=True)
          raise SystemExit(any(row['exit_code'] for row in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-ui-review-evidence
          path: |
            .runtime/reports/ownership-ui-review
            .runtime/tests/playwright
          retention-days: 3
