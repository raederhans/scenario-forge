name: Raster R0-R2 legacy safety validation
on:
  push:
    branches: [codex/raster-r0-r2-bootstrap-20261012]
    paths: [.github/workflows/raster-r0-r2-resume.yml]
permissions:
  contents: read
concurrency:
  group: raster-r0-r2-owned-candidate
  cancel-in-progress: false
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPORT: .runtime/reports/generated/raster-r0-r2-legacy
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
      SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/raster-r0-r2-safety-dist
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 3817897a94c8cd7857b073f6402be6ae3429e708
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify focused behavior and existing boundaries
        run: |
          mkdir -p "$REPORT"
          git rev-parse HEAD > "$REPORT/revision.txt"
          git update-ref refs/remotes/origin/main b09a2e8e40895789924adee4305750fc642458d6
          npm ci --ignore-scripts > "$REPORT/install.log" 2>&1
          node --test tests/political_id_raster_trial_behavior.test.mjs tests/political_id_raster_source_behavior.test.mjs tests/political_id_raster_runtime_owner_behavior.test.mjs tests/political_id_raster_runtime_assets_behavior.test.mjs tests/political_pass_orchestrator_owner_behavior.test.mjs tests/political_partial_repaint_owner_behavior.test.mjs tests/renderer_political_pass_orchestration_preflight.test.mjs > "$REPORT/targeted.log" 2>&1
          tail -12 "$REPORT/targeted.log"
          npm run verify:architecture-boundaries > "$REPORT/architecture.log" 2>&1
          cat "$REPORT/architecture.log"
          python -m unittest tests.test_map_renderer_political_pass_orchestrator_boundary_contract -q
          node --test --test-name-pattern='all remaining declared source-proof families' tests/state_target_private_cache_contract_behavior.test.mjs > "$REPORT/current-source-proofs.log" 2>&1
          tail -12 "$REPORT/current-source-proofs.log"
          npm run pr:plan > "$REPORT/pr-plan.log" 2>&1
          git diff --check
      - name: Build the pinned artifact and install the locked browser
        run: |
          npx playwright install --with-deps chromium > "$REPORT/browser-install.log" 2>&1
          python tools/build_pages_dist.py --output-root .runtime/raster-r0-r2-safety-dist > "$REPORT/build.log" 2>&1
          tail -5 "$REPORT/build.log"
      - name: Run the five existing 1936 release cases without changing their assertions
        run: |
          set -uo pipefail
          python -m http.server 4173 --bind 127.0.0.1 --directory .runtime/raster-r0-r2-safety-dist > "$REPORT/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/app/ > /dev/null; then break; fi
            sleep 1
          done
          code=0
          node node_modules/@playwright/test/cli.js test tests/e2e/release/pages_public_release_gate.spec.js --grep 'public Pages raster hoi4_1936' --workers=1 --retries=0 > "$REPORT/legacy-release.log" 2>&1 || code=$?
          cat "$REPORT/legacy-release.log"
          echo "$code" > "$REPORT/legacy-exit-code.txt"
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: raster-r0-r2-legacy-safety-evidence
          path: |
            .runtime/reports/generated/
            .runtime/tests/playwright/
          retention-days: 7
          if-no-files-found: error
