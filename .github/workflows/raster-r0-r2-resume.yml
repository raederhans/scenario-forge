name: Raster R0-R2 evidence receipt
on:
  push:
    branches: [codex/raster-r0-r2-bootstrap-20261012]
    paths: [.github/workflows/raster-r0-r2-resume.yml]
permissions:
  actions: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read completed pinned evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime/input
          gh run download 38204434010 --repo raederhans/scenario-forge --name raster-r0-r2-resume-evidence --dir .runtime/input
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.runtime/input')
          print('PINNED REVISION:', (root / 'revision.txt').read_text().strip())
          print('PLANNING EXIT:', (root / 'planning-status.txt').read_text().strip())
          print('BROWSER EXIT:', (root / 'browser-exit-code.txt').read_text().strip())
          lines = (root / 'pr-plan.log').read_text().splitlines()
          print('PLANNING SUMMARY:')
          print('\n'.join(lines[:70]))
          for scenario in ('hoi4_1939', 'hoi4_1936', 'tno_1962'):
              r = json.loads((root / 'browser' / (scenario + '.json')).read_text())
              assert r.get('passed') is True, scenario
              fields = {key: r.get(key) for key in ('scenarioId', 'revision', 'environment', 'browserVersion', 'viewport', 'dpr', 'activationMs', 'stage', 'navigation', 'errors', 'warnings')}
              fields['topLevelFields'] = list(r)
              fields['samples'] = r.get('samples', [])
              print(json.dumps(fields, ensure_ascii=False))
          PY
