name: data-verify

# Data and raster checks that only matter when scenario data, the builders or the
# political raster renderer change. Not a required check; the weekly run repeats it.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/data-verify.yml'
      - 'data/**'
      - 'map_builder/**'
      - 'scenario_builder/**'
      # The validators import widely from tools/, so every Python tool counts.
      - 'tools/**/*.py'
      - 'tools/political_id_raster_app_session.mjs'
      - 'tools/verify_political_id_raster_integration.mjs'
      - 'js/core/renderer/political_id_raster*'
      - 'tests/e2e/release/**'

concurrency:
  group: data-verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock.txt -r requirements-transport.lock.txt
      - name: Run strict scenario contracts
        run: |
          mkdir -p .runtime/reports/generated
          status=0
          for scenario in blank_base modern_world tno_1962 hoi4_1936 hoi4_1939; do
            echo "::group::$scenario"
            python tools/check_scenario_contracts.py --strict --scenario-dir "data/scenarios/$scenario" \
              --report-path ".runtime/reports/generated/$scenario.strict_contract_report.json" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Run transport manifest validator
        run: python tools/check_transport_workbench_manifests.py --root data/transport_layers --report-path .runtime/reports/generated/transport_workbench_manifest_report.json
      - name: Upload contract reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-reports
          if-no-files-found: ignore
          retention-days: 3
          path: .runtime/reports/generated/

  raster:
    # The TNO raster stages of the release gate, run against a freshly built artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
      SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/raster-release/dist
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build the Pages artifact
        run: python tools/build_pages_dist.py --output-root "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT"
      - name: Run the TNO raster release stages
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT" > .runtime/raster-release/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PRs run the six TNO stages; the weekly and manual runs take the whole gate.
            npm run test:e2e:pages-public-release-gate -- --grep 'public Pages raster tno_1962 (cold startup|native references|timeout recovery and exact zoom|paint and continuous brush history|normal startup cache baseline|persistent cache revisit)$'
          else
            npm run test:e2e:pages-public-release-gate
          fi
      - name: Upload raster failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raster-failure-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
          path: |
            .runtime/raster-release/server.log
            .runtime/tests/playwright/
