name: P3B behavior acceptance
on:
  push:
    branches: [codex/paint-contours-p3b-20260925]
    paths: [.github/workflows/p3b-behavior-review.yml]
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df421c0c275ce81858edce51dc228513b41e6289
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate full source composition and product contracts
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('.runtime/reports/p3b-behavior');root.mkdir(parents=True,exist_ok=True)
          (root/'source-sha.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          commands=[
            ('node-retirement',['npm','run','test:node:ownership-retirement']),
            ('lifecycle',['npm','run','test:node:scenario-lifecycle-runtime-behavior']),
            ('source-composition',['node','--test','tests/scenario_chunk_layer_payloads_behavior.test.mjs','tests/political_collection_coverage_behavior.test.mjs','tests/political_collection_geometry_cache_behavior.test.mjs','tests/political_collection_fragment_camouflage_behavior.test.mjs','tests/scenario_spatial_chunk_selection_behavior.test.mjs']),
            ('export-behavior',['node','--test','tests/export_target_resolution_behavior.test.mjs','tests/exact_composite_reuse_behavior.test.mjs']),
            ('border-contract',['python','-m','unittest','tests.test_map_renderer_border_draw_owner_boundary_contract','tests.test_map_renderer_political_collection_boundary_contract','tests.test_map_renderer_public_contract.MapRendererPublicContractTest.test_public_whitelist_stays_explicit','tests.test_map_renderer_public_contract.MapRendererPublicContractTest.test_public_facade_named_imports_stay_whitelisted','-q']),
            ('city-regressions',['node','--test','tests/city_data_contract_behavior.test.mjs','tests/scenario_capitals_behavior.test.mjs']),
            ('architecture',['node','tools/check_architecture_boundaries.mjs']),
            ('state-writes',['node','tools/check_state_write_allowlist.mjs']),
            ('script-portfolio',['node','tools/verification/script_portfolio.mjs','check']),
            ('e2e-inventory',['node','tools/e2e_layering.mjs','check']),
            ('import-graph',['node','tools/check_test_import_graph.mjs']),
            ('routes',['node','tools/select_verification_targets.mjs','--check']),
          ]
          results=[]
          for name,command in commands:
            print(f'::group::{name}',flush=True)
            run=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            (root/f'{name}.log').write_text(run.stdout);print(run.stdout,flush=True)
            results.append({'check':name,'exit_code':run.returncode})
            (root/'checks.json').write_text(json.dumps(results,indent=2))
            print('::endgroup::',flush=True)
          raise SystemExit(any(row['exit_code'] for row in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3b-behavior-reviewed
          path: .runtime/reports/p3b-behavior
          retention-days: 3
