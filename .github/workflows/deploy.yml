name: Build and Deploy Scenario Forge

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      artifact_only:
        description: Use the verified source-built artifact; leave disabled for the tracked-dist rollback path.
        type: boolean
        default: false

concurrency:
  # 策略：同一分支只保留最新部署任务，旧任务自动取消。
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify-shared.yml
    with:
      profile: deploy-minimal
      run-e2e-smoke: false
      pages-artifact-only: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_only }}

  build:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout artifact verifier
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download verified dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-dist
          path: ${{ (github.event_name == 'workflow_dispatch' && inputs.artifact_only) && '.runtime/pages-release/dist' || 'dist' }}

      - name: Download Pages artifact admission
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-admission
          path: .runtime/pages-release

      - name: Verify artifact source and downloaded bytes
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_only
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python tools/pages_artifact_admission.py --artifact-root .runtime/pages-release/dist --verify-receipt .runtime/pages-release/receipt.json --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Validate dist artifact payload
        if: github.event_name != 'workflow_dispatch' || !inputs.artifact_only
        run: |
          test -f dist/index.html
          test -f dist/app/index.html
          test -f dist/.nojekyll
          test -f dist/app/js/main.js
          test -f dist/app/data/scenarios/index.json
          test -f dist/pages-dist-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/pages-dist-manifest.json").read_text(encoding="utf-8"))
          total_bytes = int(manifest["total_bytes"])
          max_allowed_bytes = int(manifest["max_allowed_bytes"])
          if total_bytes > max_allowed_bytes:
              raise SystemExit(f"dist size {total_bytes} exceeds gate {max_allowed_bytes}")
          print(f"dist size ok: {total_bytes / (1024 * 1024):.2f} MiB")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ (github.event_name == 'workflow_dispatch' && inputs.artifact_only) && '.runtime/pages-release/dist' || 'dist' }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Checkout release smoke tests
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node for release smoke
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          max_retries=2
          attempt=0
          until npx playwright install chromium; do
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "playwright install chromium failed after $((attempt + 1)) attempts"
              exit 1
            fi
            sleep_seconds=$((2 ** attempt))
            echo "playwright install chromium failed on attempt $((attempt + 1)); retry in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Smoke deployed Pages URL
        env:
          SCENARIO_FORGE_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:e2e:pages-public-release-gate
