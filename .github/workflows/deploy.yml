name: Build and Deploy Scenario Forge

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  # 策略：同一分支只保留最新部署任务，旧任务自动取消。
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Build once, exercise that exact directory in a browser, then upload it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
      SCENARIO_FORGE_PAGES_ARTIFACT_ROOT: .runtime/pages-release/dist
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Build the Pages artifact
        # Stdlib-only: the builder needs no Python packages.
        run: python tools/build_pages_dist.py --output-root "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT"
      - name: Check the Pages artifact startup shell
        run: python -m unittest tests.test_pages_dist_startup_shell -q
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Exercise the built artifact in a browser
        id: artifact_checks
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory "$SCENARIO_FORGE_PAGES_ARTIFACT_ROOT" > .runtime/pages-release/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          # Golden flows on the bundled artifact itself: save/reopen and PNG export.
          node node_modules/@playwright/test/cli.js test tests/e2e/golden --grep 'saved project|exported PNG' --workers=1 --retries=0
      - name: Upload failure evidence
        if: failure() && steps.artifact_checks.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-artifact-failure-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
          path: |
            .runtime/pages-release/server.log
            .runtime/tests/playwright/
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .runtime/pages-release/dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Confirm the published site answers
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # The artifact was exercised in a browser before upload; after publication
          # only confirm that the CDN serves the landing page, the editor, its bundle
          # entry, the scenario index and the HGO app.
          base="${PAGES_URL%/}"
          for path in "/" "/app/" "/app/js/bundle/main.js" "/app/data/scenarios/index.json" "/hgo/"; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 30 --output /dev/null "$base$path"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then echo "::error::$base$path did not answer"; exit 1; fi
            echo "ok $base$path"
          done
