name: Build and Deploy Scenario Forge

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      artifact_only:
        description: Deploy the verified source-built artifact (default); disable only for a legacy tracked-dist revision.
        type: boolean
        default: true

concurrency:
  # 策略：同一分支只保留最新部署任务，旧任务自动取消。
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify-shared.yml
    with:
      profile: deploy-minimal
      run-e2e-smoke: false
      pages-artifact-only: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_only }}

  build:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout artifact verifier
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /tools/pages_artifact_admission.py
            /tools/pages_artifact_root.py
            /tools/pages_artifact_shadow.py

      - name: Download verified dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-dist
          path: ${{ (github.event_name != 'workflow_dispatch' || inputs.artifact_only) && '.runtime/pages-release/dist' || 'dist' }}

      - name: Download Pages artifact admission
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-admission
          path: .runtime/pages-release

      - name: Verify artifact source and downloaded bytes
        if: github.event_name != 'workflow_dispatch' || inputs.artifact_only
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python tools/pages_artifact_admission.py --artifact-root .runtime/pages-release/dist --verify-receipt .runtime/pages-release/receipt.json --expected-source-sha "$EXPECTED_SOURCE_SHA"

      - name: Validate dist artifact payload
        if: github.event_name == 'workflow_dispatch' && !inputs.artifact_only
        run: |
          test -f dist/index.html
          test -f dist/app/index.html
          test -f dist/.nojekyll
          test -f dist/app/js/main.js
          test -f dist/app/data/scenarios/index.json
          test -f dist/pages-dist-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/pages-dist-manifest.json").read_text(encoding="utf-8"))
          total_bytes = int(manifest["total_bytes"])
          max_allowed_bytes = int(manifest["max_allowed_bytes"])
          if total_bytes > max_allowed_bytes:
              raise SystemExit(f"dist size {total_bytes} exceeds gate {max_allowed_bytes}")
          print(f"dist size ok: {total_bytes / (1024 * 1024):.2f} MiB")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ (github.event_name != 'workflow_dispatch' || inputs.artifact_only) && '.runtime/pages-release/dist' || 'dist' }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Checkout release smoke tests
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /package.json
            /package-lock.json
            /playwright.config.cjs
            /tests/e2e/release/
            /tests/e2e/support/
            /tools/verify_political_id_raster_integration.mjs
            /tools/political_id_raster_app_session.mjs
            /apps/hgo/index.html
            /apps/hgo/styles.css
            /apps/hgo/src/
            /apps/hgo/assets/default/

      - name: Setup Node for release smoke
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          max_retries=2
          attempt=0
          until npx playwright install chromium; do
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "playwright install chromium failed after $((attempt + 1)) attempts"
              exit 1
            fi
            sleep_seconds=$((2 ** attempt))
            echo "playwright install chromium failed on attempt $((attempt + 1)); retry in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Smoke deployed Pages URL
        id: pages_smoke
        env:
          SCENARIO_FORGE_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # The complete gate, including every raster profile, already ran against
          # this exact artifact before upload (verify-shared deploy-minimal). After
          # publication only confirm CDN availability; repeating the heavy raster
          # timing checks here failed on CDN timing after the site was already live.
          npm run test:e2e:pages-public-release-gate -- --grep-invert "public Pages raster"

      - name: Verify deployed HGO bytes against source SHA
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile, readdir, realpath} from 'node:fs/promises';
          import path from 'node:path';

          const sourceSha = process.env.GITHUB_SHA;
          assert.match(sourceSha || '', /^[0-9a-f]{40}$/i);
          const base = new URL(process.env.PAGES_URL);
          assert.equal(base.protocol, 'https:');
          if (!base.pathname.endsWith('/')) base.pathname += '/';
          const source = path.resolve('apps/hgo'), dataset = path.join(source, 'assets/default');
          const files = new Set(['index.html', 'styles.css', 'assets/default/manifest.json']);
          const within = (root, filename) => {
            const relative = path.relative(root, filename);
            assert.ok(relative && relative !== '..' && !relative.startsWith(`..${path.sep}`) && !path.isAbsolute(relative), 'HGO path escapes its source');
            return relative.split(path.sep).join('/');
          };
          async function collect(directory) {
            for (const entry of await readdir(directory, {withFileTypes:true})) {
              const filename = path.join(directory, entry.name);
              if (entry.isDirectory()) await collect(filename);
              else if (['.js', '.json', '.css'].includes(path.extname(entry.name))) files.add(within(source, await realpath(filename)));
            }
          }
          await collect(path.join(source, 'src'));
          const manifest = JSON.parse(await readFile(path.join(dataset, 'manifest.json'), 'utf8'));
          for (const url of [...Object.values(manifest.assets).map(asset => asset.url), manifest.source.provenanceUrl]) {
            assert.ok(typeof url === 'string' && url && !/[?#]/.test(url) && !/^[a-z][a-z0-9+.-]*:/i.test(url), 'Expected a relative dataset asset');
            const decoded = decodeURIComponent(url);
            assert.ok(!decoded.startsWith('/') && !decoded.includes('\\') && !decoded.includes(':'), 'Invalid dataset asset path');
            const filename = await realpath(path.resolve(dataset, decoded));
            within(dataset, filename);
            files.add(within(source, filename));
          }
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          console.log(JSON.stringify({sourceSha, verification:'deployed-hgo-source-bytes', files:files.size}));
          let totalBytes = 0;
          for (const filename of [...files].sort()) {
            let expected = await readFile(path.join(source, filename));
            if (filename === 'index.html') {
              const html = expected.toString('utf8');
              assert.equal(html.split('href="../../index.html"').length - 1, 1);
              expected = Buffer.from(html.replace('href="../../index.html"', 'href="../app/"'));
            }
            const url = new URL(`hgo/${filename.split('/').map(encodeURIComponent).join('/')}`, base);
            const response = await fetch(url, {cache:'no-store', signal:AbortSignal.timeout(15000)});
            assert.ok(response.ok, `${filename}: HTTP ${response.status}`);
            const actual = Buffer.from(await response.arrayBuffer());
            const expectedHash = digest(expected), actualHash = digest(actual);
            console.log(JSON.stringify({sourceSha, file:filename, expectedHash, actualHash, bytes:actual.length}));
            assert.equal(actualHash, expectedHash, `${filename}: deployed HGO bytes differ from source ${sourceSha}`);
            totalBytes += actual.length;
          }
          console.log(JSON.stringify({sourceSha, verifiedFiles:files.size, totalBytes, passed:true}));
          JS

      - name: Upload deployed Pages failure evidence
        if: failure() && steps.pages_smoke.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-deployed-failure-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            .runtime/reports/test-timings.ndjson
            .runtime/reports/generated/failure-context-index.ndjson
            .runtime/tests/playwright/

  timing-summary:
    name: Deployment timing summary
    needs: [verify, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Diagnostics only: never change the result or dependencies of release gates.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout timing reporter
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/deploy_timing_summary.py

      - name: Summarize deployment stage durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime/tmp
          if curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > .runtime/tmp/deploy-jobs.json \
            && python tools/deploy_timing_summary.py < .runtime/tmp/deploy-jobs.json >> "$GITHUB_STEP_SUMMARY"; then
            echo "Deployment timing summary written."
          else
            echo "::warning::Deployment timing data unavailable; see individual job logs."
            echo "Deployment timing data unavailable; see individual job logs. Release gate results are unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
