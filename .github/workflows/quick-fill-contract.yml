name: Quick Fill Contract

on:
  push:
    branches: [codex/quick-fill-hierarchy-phases-1-3-20260921]
    paths: ['.github/workflows/quick-fill-contract.yml']

permissions:
  contents: write

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/quick-fill-hierarchy-phases-1-3-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/quick-fill-hierarchy-phases-1-3-20260921
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Apply verified project-scope compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          test -f js/core/quick_fill_hierarchy.js
          test ! -d tools/.quick-fill-delivery
          python - <<'PY'
          from pathlib import Path
          path = Path('js/core/file_manager.js')
          text = path.read_text()
          old = 'function normalizeBatchFillScope(value) {\n  return String(value || "").trim().toLowerCase() === "country" ? "country" : "parent";\n}'
          if text.count(old) != 1:
              raise SystemExit('Unexpected project scope normalizer')
          text = 'import { normalizeQuickFillScope } from "./quick_fill_hierarchy.js";\n' + text.replace(old, 'function normalizeBatchFillScope(value) {\n  return normalizeQuickFillScope(String(value || "").trim().toLowerCase());\n}')
          path.write_text(text)
          path = Path('tools/verification/catalog/records/quick_fill.mjs')
          text = path.read_text()
          old = '      "tests/quick_fill_hierarchy.test.mjs", "tests/fill_target_policy_behavior.test.mjs", "tests/parent_border_grouping_policy_behavior.test.mjs",'
          if text.count(old) != 1:
              raise SystemExit('Unexpected quick-fill route')
          path.write_text(text.replace(old, old + '\n      "js/core/file_manager.js", "tests/quick_fill_project_roundtrip.test.mjs",'))
          PY
      - name: Install repository dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
          mkdir -p .runtime/reports/generated
      - name: Project persistence and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:node:quick-fill 2>&1 | tee .runtime/reports/generated/quick-fill-node-tests.log
          node --test tests/file_manager_project_roundtrip_behavior.test.mjs 2>&1 | tee .runtime/reports/generated/quick-fill-project-tests.log
          npm run verify:quick-fill-data 2>&1 | tee .runtime/reports/generated/quick-fill-data-tests.log
          npm run verify:script-portfolio
          node tools/select_verification_targets.mjs --check
          npm run verify:state-write-allowlist
          npm run verify:test-import-graph
      - name: Canonical Pages mirrors and feature-branch commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_pages_dist.py 2>&1 | tee .runtime/reports/generated/quick-fill-pages-build.log
          git diff --check
          git add -- js/core/file_manager.js tools/verification/catalog/records/quick_fill.mjs
          git add -u -- dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve explicit quick-fill levels across project save and import'
          git push origin HEAD:refs/heads/codex/quick-fill-hierarchy-phases-1-3-20260921
          git rev-parse HEAD > .runtime/reports/generated/quick-fill-tested-sha.txt
      - name: Integration contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture-boundaries 2>&1 | tee .runtime/reports/generated/quick-fill-architecture.log
          npm run test:node:scenario-lifecycle-runtime-behavior 2>&1 | tee .runtime/reports/generated/quick-fill-lifecycle-tests.log
      - name: Live toolbar smoke on localhost
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python tools/dev_server.py --port 8810 > .runtime/reports/generated/quick-fill-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8810/app/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/check_quick_fill_browser.mjs 2>&1 | tee .runtime/reports/generated/quick-fill-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quick-fill-verification
          path: |
            .runtime/reports/generated/quick-fill*
            .runtime/browser/quick-fill/
          retention-days: 7
