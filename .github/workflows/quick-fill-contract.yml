name: Quick Fill Contract

on:
  pull_request:
    paths:
      - '.github/workflows/quick-fill-contract.yml'
      - 'js/core/quick_fill_hierarchy.js'
      - 'js/core/file_manager.js'
      - 'js/core/map_renderer.js'
      - 'js/core/map_renderer/click_selection_transaction_owner.js'
      - 'js/core/renderer/fill_target_policy.js'
      - 'js/core/renderer/parent_border_grouping_policy.js'
      - 'js/core/scenario_districts.js'
      - 'js/core/history*.js'
      - 'js/ui/toolbar/*quick_fill*'
      - 'js/ui/toolbar/workspace_chrome_support_surface_controller.js'
      - 'map_builder/quick_fill*'
      - 'map_builder/schemas/quick_fill*'
      - 'data/hierarchy.json'
      - 'data/quick_fill/**'
      - 'tools/*quick_fill*'
      - 'tools/build_china_prefecture_crosswalk.py'
      - 'tools/verification/catalog/records/quick_fill.mjs'
      - 'tests/*quick_fill*'

permissions:
  contents: read

concurrency:
  group: quick-fill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install repository-locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
          mkdir -p .runtime/reports/generated
          git rev-parse HEAD > .runtime/reports/generated/quick-fill-tested-sha.txt
      - name: Runtime, data and verification-routing contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:node:quick-fill 2>&1 | tee .runtime/reports/generated/quick-fill-node-tests.log
          node --test tests/file_manager_project_roundtrip_behavior.test.mjs 2>&1 | tee .runtime/reports/generated/quick-fill-project-tests.log
          npm run verify:quick-fill-data 2>&1 | tee .runtime/reports/generated/quick-fill-data-tests.log
          npm run audit:quick-fill
          python tools/data_health.py 2>&1 | tee .runtime/reports/generated/quick-fill-data-health.log
          python -m unittest tests.test_data_catalog_contract -v 2>&1 | tee .runtime/reports/generated/quick-fill-catalog-tests.log
          npm run verify:script-portfolio
          node tools/select_verification_targets.mjs --check
          node --test tests/precision_scaling_verification_records.test.mjs tests/verification_script_portfolio_behavior.test.mjs 2>&1 | tee .runtime/reports/generated/quick-fill-routing-tests.log
      - name: Integration contracts and canonical Pages build
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:architecture-boundaries 2>&1 | tee .runtime/reports/generated/quick-fill-architecture.log
          npm run verify:state-write-allowlist 2>&1 | tee .runtime/reports/generated/quick-fill-state-writes.log
          npm run verify:test-import-graph
          npm run test:node:scenario-lifecycle-runtime-behavior 2>&1 | tee .runtime/reports/generated/quick-fill-lifecycle-tests.log
          python tools/build_pages_dist.py 2>&1 | tee .runtime/reports/generated/quick-fill-pages-build.log
          git diff --check
      - name: Live toolbar smoke on localhost
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          python tools/dev_server.py --port 8810 > .runtime/reports/generated/quick-fill-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8810/app/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/check_quick_fill_browser.mjs 2>&1 | tee .runtime/reports/generated/quick-fill-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quick-fill-verification
          path: |
            .runtime/reports/generated/quick-fill*
            .runtime/browser/quick-fill/
          retention-days: 7
