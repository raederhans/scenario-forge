name: P3B closeout consistency
on:
  push:
    branches: [codex/p3b-acceptance-20260925]
    paths: [.github/workflows/p3b-final-consistency.yml]
permissions:
  contents: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/paint-contours-p3b-20260925
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.lock.txt
      - name: Correct only the two reviewed evidence markers from authoritative metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          source='9d6a22bb233c93a723a4787781fe93207384bfdb'
          base='f98c734790233bc31993506bd1761be85cea90c5'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==source,'Refusing concurrent source change'
          root=Path('.runtime/reports/p3b-final-consistency');root.mkdir(parents=True,exist_ok=True)
          markers=[('hoi4-1939-europe-features','hero-hoi4-1939.json',6081,6080),('tno-1962-europe-features','hero-tno-1962.json',3236,3247)]
          paths=['landing/index.html','dist/index.html'];changes=[]
          for path in paths:
              assert git('rev-parse',f'HEAD:{path}')==git('rev-parse',f'{base}:{path}'),path
              p=Path(path);text=p.read_text()
              for marker,asset,old,expected in markers:
                  metadata=f'landing/assets/{asset}'
                  assert json.loads(Path(metadata).read_text())['counts']['political_features']==expected,'Unreviewed metadata change'
                  pattern=rf'(<div data-sample-evidence="{re.escape(marker)}"[^>]*>.*?<dd data-sample-evidence-value="){old}(">){old}(</dd>)'
                  text,count=re.subn(pattern,lambda m:m[1]+str(expected)+m[2]+str(expected)+m[3],text,flags=re.S)
                  assert count==1,f'Expected one stale {marker} in {path}'
                  changes.append({'path':path,'marker':marker,'old':old,'new':expected,'source':metadata+':counts.political_features'})
              p.write_text(text)
          assert set(git('diff','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--check'],check=True)
          (root/'correction.json').write_text(json.dumps({'source':source,'base':base,'baseline_identical_paths':paths,'correction':changes},indent=2))
          PY
      - name: Verify corrected source and checked-in output without weakening assertions
        run: |
          set -o pipefail
          node --test tests/landing_showcase_view_behavior.test.mjs 2>&1 | tee .runtime/reports/p3b-final-consistency/landing.log
      - name: Recheck contour, history, export and reference behavior
        run: |
          set -o pipefail
          npm run test:node:ownership-retirement 2>&1 | tee .runtime/reports/p3b-final-consistency/contour-behavior.log
      - name: Build and compare published assets
        run: |
          set -o pipefail
          python tools/build_pages_dist.py --output-root .runtime/p3b-final/pages 2>&1 | tee .runtime/reports/p3b-final-consistency/build.log
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.runtime/p3b-final/pages');out=[]
          html=(root/'index.html').read_text()
          for number in [6080,3247]:assert f'data-sample-evidence-value="{number}">{number}</dd>' in html
          for path in ['js/workers/paint_contour.worker.js','js/core/paint_contour_worker_client.js','js/core/paint_contour_source.js','js/core/renderer/paint_contour_graph.js','js/core/renderer/paint_contour_runtime.js','js/core/renderer/paint_contour_mesh.js']:
              data=Path(path).read_bytes();assert (root/'app'/path).read_bytes()==data,path
              out.append({'path':path,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)})
          Path('.runtime/reports/p3b-final-consistency/published-files.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Commit only the tested evidence corrections to the existing task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- landing/index.html dist/index.html
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m 'fix: synchronize 1939 and TNO showcase evidence with merged source metadata'
          git push origin HEAD:codex/paint-contours-p3b-20260925
          git rev-parse HEAD > .runtime/reports/p3b-final-consistency/source-sha.txt
          git show --stat --oneline HEAD > .runtime/reports/p3b-final-consistency/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p3b-final-consistency
          path: .runtime/reports/p3b-final-consistency
          retention-days: 7
