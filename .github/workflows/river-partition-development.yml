name: River partition development

on:
  push:
    branches: [codex/river-paint-partitions-p0-p2]
    paths: [.github/workflows/river-partition-development.yml]

permissions:
  contents: write

concurrency:
  group: river-partition-development
  cancel-in-progress: false

jobs:
  implementation-and-verification:
    if: github.repository == 'raederhans/scenario-forge' && github.ref == 'refs/heads/codex/river-paint-partitions-p0-p2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply reviewed geometry build compatibility guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/tmp .runtime/reports/generated/river-paint
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          transfer = pathlib.Path('.codex/river-paint-source-guard.b64')
          if transfer.exists():
              patch = lzma.decompress(base64.b64decode(transfer.read_bytes(), validate=True))
              if len(patch) != 11329 or hashlib.sha256(patch).hexdigest() != '684bb904f95f4f6f1289ec41715de23a69e2c0ef69d353a31a252c9c8de3fded':
                  raise RuntimeError('Source guard integrity mismatch')
              target = pathlib.Path('.runtime/tmp/river-source-guard.patch')
              target.write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', str(target)], check=True)
              subprocess.run(['git', 'apply', '--index', str(target)], check=True)
              subprocess.run(['git', 'rm', str(transfer)], check=True)
          PY
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^\.github/|^data/scenarios/|^data/global_rivers'; then
            echo 'Unexpected workflow or authoritative geography modification' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix(river-paint): reject regenerated geometry builds with unchanged ownership hashes'
            git push origin HEAD:refs/heads/codex/river-paint-partitions-p0-p2
          fi
          git rev-parse HEAD | tee .runtime/reports/generated/river-paint/implementation-sha.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
      - name: P0 geometry and catalog governance
        id: geometry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_river_partitions.py tests/test_data_catalog_contract.py | tee .runtime/reports/generated/river-paint/python-tests.txt
          python tools/data_health.py | tee .runtime/reports/generated/river-paint/data-health.txt
      - name: P1-P2 state, roundtrip, owner and existing workflow regressions
        id: node
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run test:node:river-paint | tee .runtime/reports/generated/river-paint/river-tests.txt
          npm run test:node:ownership-retirement | tee .runtime/reports/generated/river-paint/ownership-regressions.txt
          node --test tests/project_import_transaction_behavior.test.mjs tests/scenario_state_actions_atomicity_behavior.test.mjs tests/scenario_lifecycle_runtime_behavior.test.mjs tests/political_partial_repaint_owner_behavior.test.mjs tests/political_pass_orchestrator_owner_behavior.test.mjs tests/precision_scaling_verification_records.test.mjs tests/paint_contour_verification_records.test.mjs | tee .runtime/reports/generated/river-paint/integration-regressions.txt
          npm run verify:architecture-boundaries | tee .runtime/reports/generated/river-paint/architecture.txt
          npm run verify:state-write-allowlist | tee .runtime/reports/generated/river-paint/write-allowlist.txt
      - name: Install native Chromium
        run: npx playwright install --with-deps chromium
      - name: Actual application flow and native canvas pixels
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/river_paint.spec.js --workers=1 --retries=0 | tee .runtime/reports/generated/river-paint/browser-tests.txt
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: river-paint-p0-p2-verification
          path: |
            .runtime/reports/generated/river-paint/
            .runtime/tests/playwright/
          retention-days: 7
          if-no-files-found: error
      - name: Require every selected check
        if: always()
        env:
          GEOMETRY: ${{ steps.geometry.outcome }}
          NODE: ${{ steps.node.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          test "$GEOMETRY" = success
          test "$NODE" = success
          test "$BROWSER" = success
