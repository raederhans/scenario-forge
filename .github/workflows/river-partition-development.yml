name: River partition development

on:
  push:
    branches: [codex/river-paint-partitions-p0-p2]
    paths: [.github/workflows/river-partition-development.yml]

permissions:
  contents: write

concurrency:
  group: river-partition-development
  cancel-in-progress: false

jobs:
  implementation-and-verification:
    if: github.repository == 'raederhans/scenario-forge' && github.ref == 'refs/heads/codex/river-paint-partitions-p0-p2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and apply exact reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/tmp .runtime/reports/generated/river-paint
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          stage = pathlib.Path('.codex/river-paint-stage')
          if not stage.exists():
              if not pathlib.Path('js/core/river_paint/runtime.js').is_file():
                  raise RuntimeError('Neither verified stage nor applied source exists')
              print('Implementation already applied; verifying current source')
          else:
              m = json.loads((stage / 'manifest.json').read_text())
              if m['sha256'] != '1b69462198c365211076fa6b1160994b630ce0b995e6c67089e03bf76f52181d' or m['parts'] != 8:
                  raise RuntimeError('Unexpected transfer identity')
              chunks = []
              for i, expected in enumerate(m['partSha256']):
                  data = (stage / f'part-{i:02}.b64').read_bytes()
                  if hashlib.sha256(data).hexdigest() != expected:
                      raise RuntimeError(f'Corrupt transfer part {i}: {hashlib.sha256(data).hexdigest()}')
                  chunks.append(data)
              encoded = b''.join(chunks)
              if len(encoded) != m['base64Bytes']:
                  raise RuntimeError('Encoded length mismatch')
              patch = lzma.decompress(base64.b64decode(encoded, validate=True))
              if len(patch) != m['bytes'] or hashlib.sha256(patch).hexdigest() != m['sha256']:
                  raise RuntimeError('Decoded patch integrity mismatch')
              target = pathlib.Path('.runtime/tmp/river-implementation.patch')
              target.write_bytes(patch)
              subprocess.run(['git', 'apply', '--check', str(target)], check=True)
              subprocess.run(['git', 'apply', '--index', str(target)], check=True)
              print(f'Applied verified {len(patch)} byte patch')
          PY
      - name: Install pinned geometry and test dependencies
        run: |
          python -m pip install -r requirements-dev.lock.txt
          npm ci
      - name: P0 regenerate immutable six-parent pilot and catalog
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_river_partitions.py \
            --land data/scenarios/modern_world/runtime_topology.topo.json \
            --river Seine --river Elbe --river Volga --include-lake-centerlines \
            --scene-id modern_world \
            --parent FR_ARR_75001 --parent FR_ARR_76003 --parent DEE0D --parent DEE06 \
            --parent RU_RAY_50074027B53551011789267 --parent RU_RAY_50074027B57358126207690 \
            --base-commit bfedc6b8eb75ae6caf15fee4711f2499efe1d4d1 \
            --baseline-hash 7ee2527fd2eef0f5f50356a3e41089499f08c0573b642be295453389fbdc8966 \
            --output data/river_partitions/modern_world_pilot.json \
            | tee .runtime/reports/generated/river-paint/pilot-generation.txt
          if test -f data/river_partitions/modern_world_pilot.audit.json; then
            mv data/river_partitions/modern_world_pilot.audit.json .runtime/reports/generated/river-paint/
          fi
          python tools/build_data_catalog.py | tee .runtime/reports/generated/river-paint/catalog.txt
          git diff --check
      - name: Commit implementation only to isolated development branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/river-paint-partitions-p0-p2
          if test -d .codex/river-paint-stage; then git rm -r .codex/river-paint-stage; fi
          git add data/river_partitions/modern_world_pilot.json data/CATALOG.json data/CATALOG.md
          git diff --cached --name-only > .runtime/reports/generated/river-paint/changed-files.txt
          if git diff --cached --name-only | grep -E '^\.github/|^data/scenarios/|^data/global_rivers'; then
            echo 'Unexpected workflow or authoritative geography modification' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(river-paint): implement P0-P2 immutable pilot partitions and editing workflow'
            git push origin HEAD:refs/heads/codex/river-paint-partitions-p0-p2
          fi
          git rev-parse HEAD | tee .runtime/reports/generated/river-paint/implementation-sha.txt
      - name: P0 geometry and data governance checks
        id: geometry
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_river_partitions.py tests/test_data_catalog_contract.py | tee .runtime/reports/generated/river-paint/python-tests.txt
          python tools/data_health.py | tee .runtime/reports/generated/river-paint/data-health.txt
      - name: P1-P2 state, runtime, roundtrip and existing regression checks
        id: node
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm run test:node:river-paint | tee .runtime/reports/generated/river-paint/river-tests.txt
          npm run test:node:ownership-retirement | tee .runtime/reports/generated/river-paint/ownership-regressions.txt
          node --test tests/project_import_transaction_behavior.test.mjs tests/scenario_state_actions_atomicity_behavior.test.mjs tests/scenario_lifecycle_runtime_behavior.test.mjs tests/political_partial_repaint_owner_behavior.test.mjs tests/precision_scaling_verification_records.test.mjs tests/paint_contour_verification_records.test.mjs | tee .runtime/reports/generated/river-paint/integration-regressions.txt
      - name: Install native Chromium
        run: npx playwright install --with-deps chromium
      - name: Native browser pilot and actual canvas pixel checks
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/river_paint.spec.js --workers=1 --retries=0 | tee .runtime/reports/generated/river-paint/browser-tests.txt
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: river-paint-p0-p2-verification
          path: |
            .runtime/reports/generated/river-paint/
            .runtime/tests/playwright/
          retention-days: 7
          if-no-files-found: error
      - name: Require every selected verification to pass
        if: always()
        env:
          GEOMETRY: ${{ steps.geometry.outcome }}
          NODE: ${{ steps.node.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          test "$GEOMETRY" = success
          test "$NODE" = success
          test "$BROWSER" = success
