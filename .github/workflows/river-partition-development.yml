name: River partition browser verification
on:
  push:
    branches: [codex/river-paint-partitions-p0-p2]
    paths: [.github/workflows/river-partition-development.yml]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'raederhans/scenario-forge' && github.ref == 'refs/heads/codex/river-paint-partitions-p0-p2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Bounded complete flow and canvas pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/reports/generated/river-paint
          git rev-parse HEAD > .runtime/reports/generated/river-paint/browser-source-sha.txt
          npx playwright test tests/e2e/river_paint.spec.js --workers=1 --retries=0 | tee .runtime/reports/generated/river-paint/browser-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: river-paint-browser-verification
          path: |
            .runtime/reports/generated/river-paint/
            .runtime/tests/playwright/
          retention-days: 7
          if-no-files-found: error
